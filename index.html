<script>

/* =====================================================
   VARIÁVEIS
===================================================== */

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");

var W = 0;
var H = 0;

var playing = false;
var paused = false;

var level = 1;
var lives = 3;
var eggs = 0;
var score = 0;

var particles = [];

var camera = {
  x:0,
  y:0
};

var keys = {
  up:false,
  down:false,
  left:false,
  right:false
};

var world = {
  width:1600,
  height:950,
  obstacles:[],
  bushes:[],
  eggs:[],
  enemies:[],
  exit:null
};

var chicken = {
  x:120,
  y:200,
  r:20,
  speed:4,
  dash:0,
  invincible:0,
  hidden:false
};

var bestScore =
  Number(localStorage.getItem("fugaGalinhaBest") || 0);

document.getElementById("best").textContent=bestScore;

/* =====================================================
   TAMANHO
===================================================== */

function resize(){

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=W;
  canvas.height=H;
}

window.addEventListener("resize",resize);

resize();

/* =====================================================
   INICIAR JOGO
===================================================== */

function startGame(){

  console.log("JOGO INICIADO");

  document.getElementById("menu")
    .classList.add("hidden");

  document.getElementById("end")
    .classList.add("hidden");

  document.getElementById("hud")
    .classList.remove("hidden");

  document.getElementById("pause")
    .classList.remove("hidden");

  playing=true;
  paused=false;

  level=1;
  lives=3;
  eggs=0;
  score=0;

  particles=[];

  camera.x=0;
  camera.y=0;

  createLevel();

  updateHUD();

  message("🐔 CORRA!");

}

/* =====================================================
   MENU
===================================================== */

function goMenu(){

  playing=false;

  document.getElementById("end")
    .classList.add("hidden");

  document.getElementById("hud")
    .classList.add("hidden");

  document.getElementById("pause")
    .classList.add("hidden");

  document.getElementById("menu")
    .classList.remove("hidden");

}

/* =====================================================
   INSTRUÇÕES
===================================================== */

function showInstructions(){

  document
    .getElementById("instructions")
    .classList.toggle("hidden");

}

/* =====================================================
   PAUSA
===================================================== */

function togglePause(){

  if(!playing)return;

  paused=!paused;

  document.getElementById("pause")
    .textContent=paused?"▶️":"⏸️";

  if(paused){
    message("⏸️ PAUSADO");
  }

}

/* =====================================================
   CRIAR FASE
===================================================== */

function createLevel(){

  world.width=1600+level*50;
  world.height=950+level*30;

  world.obstacles=[];
  world.bushes=[];
  world.eggs=[];
  world.enemies=[];

  chicken.x=120;
  chicken.y=200;
  chicken.dash=0;
  chicken.invincible=0;

  /* bordas */

  world.obstacles.push(
    {x:-100,y:-100,w:world.width+200,h:80},
    {x:-100,y:world.height-20,w:world.width+200,h:100},
    {x:-100,y:-100,w:80,h:world.height+200},
    {x:world.width-20,y:-100,w:100,h:world.height+200}
  );

  /* construções */

  addObstacle(40,40,230,150);
  addObstacle(370,100,180,120);
  addObstacle(680,280,230,120);
  addObstacle(1030,100,220,150);
  addObstacle(280,500,220,120);
  addObstacle(700,650,220,130);
  addObstacle(1110,500,230,120);

  if(level>=2){
    addObstacle(550,430,100,180);
    addObstacle(930,350,90,150);
  }

  if(level>=4){
    addObstacle(100,350,130,100);
    addObstacle(1280,700,180,90);
  }

  if(level>=6){
    addObstacle(600,160,90,100);
    addObstacle(950,550,100,100);
  }

  /* moitas */

  for(
    var i=0;
    i<18+level*2;
    i++
  ){

    var bush=findFreePoint();

    world.bushes.push({
      x:bush.x,
      y:bush.y,
      r:30+Math.random()*12
    });

  }

  /* ovos */

  for(
    var j=0;
    j<7+level;
    j++
  ){

    var egg=findFreePoint();

    world.eggs.push({
      x:egg.x,
      y:egg.y,
      collected:false,
      pulse:Math.random()*10
    });

  }

  /* inimigos */

  for(
    var k=0;
    k<2+level;
    k++
  ){

    var enemy=findFreePoint();

    world.enemies.push({
      x:enemy.x,
      y:enemy.y,
      r:k%3===0&&level>=3?22:24,
      type:k%3===0&&level>=3?"dog":"farmer",
      speed:k%3===0&&level>=3?1.7:1.2,
      targetX:enemy.x,
      targetY:enemy.y,
      state:"patrol",
      alert:0
    });

  }

  /* saída */

  world.exit={
    x:world.width-120,
    y:world.height-150,
    w:60,
    h:80
  };

  message(
    "🌾 FASE "+level+
    " — "+levelName()
  );

}

/* =====================================================
   OBSTÁCULO
===================================================== */

function addObstacle(x,y,w,h){

  world.obstacles.push({
    x:x,
    y:y,
    w:w,
    h:h
  });

}

/* =====================================================
   PONTO LIVRE
===================================================== */

function findFreePoint(){

  for(
    var i=0;
    i<500;
    i++
  ){

    var p={
      x:100+Math.random()*(world.width-200),
      y:100+Math.random()*(world.height-200)
    };

    var blocked=false;

    for(
      var j=0;
      j<world.obstacles.length;
      j++
    ){

      if(circleRect(
        p.x,
        p.y,
        30,
        world.obstacles[j]
      )){
        blocked=true;
        break;
      }

    }

    if(
      !blocked &&
      Math.hypot(
        p.x-chicken.x,
        p.y-chicken.y
      )>220
    ){
      return p;
    }

  }

  return {
    x:500,
    y:400
  };

}

/* =====================================================
   NOME FASE
===================================================== */

function levelName(){

  var names=[
    "A GALINHEIRA",
    "CAMPO DE MILHO",
    "O CACHORRO",
    "TRATOR DESCONTROLADO",
    "FUGA NOTURNA",
    "A ESTRADA"
  ];

  return names[level-1]||"";

}

/* =====================================================
   COLISÃO
===================================================== */

function circleRect(cx,cy,r,o){

  var nx=Math.max(
    o.x,
    Math.min(cx,o.x+o.w)
  );

  var ny=Math.max(
    o.y,
    Math.min(cy,o.y+o.h)
  );

  var dx=cx-nx;
  var dy=cy-ny;

  return dx*dx+dy*dy<r*r;

}

/* =====================================================
   MOVIMENTO
===================================================== */

function moveChicken(){

  var dx=0;
  var dy=0;

  if(keys.left)dx--;
  if(keys.right)dx++;

  if(keys.up)dy--;
  if(keys.down)dy++;

  if(dx||dy){

    var length=Math.hypot(dx,dy);

    dx/=length;
    dy/=length;

    var speed=
      chicken.dash>0
      ? 9
      : chicken.speed;

    moveObject(
      chicken,
      dx*speed,
      dy*speed
    );

    particle(
      chicken.x-8,
      chicken.y+15,
      "#e8ead1"
    );

  }

  if(chicken.dash>0){
    chicken.dash--;
  }

  if(chicken.invincible>0){
    chicken.invincible--;
  }

  chicken.hidden=false;

  for(
    var i=0;
    i<world.bushes.length;
    i++
  ){

    var b=world.bushes[i];

    if(
      Math.hypot(
        chicken.x-b.x,
        chicken.y-b.y
      )<b.r
    ){

      chicken.hidden=true;
      break;

    }

  }

}

/* =====================================================
   MOVIMENTO COM COLISÃO
===================================================== */

function moveObject(obj,dx,dy){

  obj.x+=dx;

  for(
    var i=0;
    i<world.obstacles.length;
    i++
  ){

    var o=world.obstacles[i];

    if(
      circleRect(
        obj.x,
        obj.y,
        obj.r,
        o
      )
    ){

      if(dx>0)obj.x=o.x-obj.r;
      if(dx<0)obj.x=o.x+o.w+obj.r;

    }

  }

  obj.y+=dy;

  for(
    var j=0;
    j<world.obstacles.length;
    j++
  ){

    var q=world.obstacles[j];

    if(
      circleRect(
        obj.x,
        obj.y,
        obj.r,
        q
      )
    ){

      if(dy>0)obj.y=q.y-obj.r;
      if(dy<0)obj.y=q.y+q.h+obj.r;

    }

  }

}

/* =====================================================
   IMPULSO
===================================================== */

function dash(){

  if(!playing||paused)return;

  chicken.dash=20;

  particle(
    chicken.x,
    chicken.y,
    "#fff36a",
    "burst"
  );

}

/* =====================================================
   BARULHO
===================================================== */

var noiseTimer=0;

function chickenNoise(){

  if(!playing||paused||noiseTimer>0)return;

  noiseTimer=100;

  message("🐔 COCÓÓÓÓÓ!");

  for(
    var i=0;
    i<world.enemies.length;
    i++
  ){

    var e=world.enemies[i];

    if(
      Math.hypot(
        e.x-chicken.x,
        e.y-chicken.y
      )<550
    ){

      e.state="chase";
      e.targetX=chicken.x;
      e.targetY=chicken.y;

    }

  }

  particle(
    chicken.x,
    chicken.y,
    "#fff36a",
    "burst"
  );

}

/* =====================================================
   INIMIGOS
===================================================== */

function updateEnemies(){

  if(noiseTimer>0)noiseTimer--;

  for(
    var i=0;
    i<world.enemies.length;
    i++
  ){

    var e=world.enemies[i];

    var distance=Math.hypot(
      e.x-chicken.x,
      e.y-chicken.y
    );

    /* detectar */

    if(
      !chicken.hidden &&
      distance<260
    ){

      e.state="chase";

    }

    if(e.state==="patrol"){

      if(
        Math.hypot(
          e.x-e.targetX,
          e.y-e.targetY
        )<25
      ){

        e.targetX=
          100+
          Math.random()*
          (world.width-200);

        e.targetY=
          100+
          Math.random()*
          (world.height-200);

      }

    }

    if(e.state==="chase"){

      e.targetX=chicken.x;
      e.targetY=chicken.y;

      if(
        chicken.hidden ||
        distance>500
      ){

        e.state="patrol";

      }

    }

    var dx=e.targetX-e.x;
    var dy=e.targetY-e.y;

    var len=Math.hypot(dx,dy)||1;

    dx/=len;
    dy/=len;

    moveEnemy(
      e,
      dx*e.speed,
      dy*e.speed
    );

    if(
      distance<e.r+chicken.r &&
      !chicken.hidden &&
      chicken.invincible<=0
    ){

      damage();

    }

  }

}

/* =====================================================
   MOVIMENTO INIMIGO
===================================================== */

function moveEnemy(e,dx,dy){

  e.x+=dx;

  for(
    var i=0;
    i<world.obstacles.length;
    i++
  ){

    if(
      circleRect(
        e.x,
        e.y,
        e.r,
        world.obstacles[i]
      )
    ){

      e.x-=dx;

      e.targetX=
        100+
        Math.random()*
        (world.width-200);

      e.targetY=
        100+
        Math.random()*
        (world.height-200);

      break;

    }

  }

  e.y+=dy;

  for(
    var j=0;
    j<world.obstacles.length;
    j++
  ){

    if(
      circleRect(
        e.x,
        e.y,
        e.r,
        world.obstacles[j]
      )
    ){

      e.y-=dy;

      e.targetX=
        100+
        Math.random()*
        (world.width-200);

      e.targetY=
        100+
        Math.random()*
        (world.height-200);

      break;

    }

  }

}

/* =====================================================
   DANO
===================================================== */

function damage(){

  lives--;

  chicken.invincible=100;

  chicken.x=120;
  chicken.y=200;

  updateHUD();

  particle(
    chicken.x,
    chicken.y,
    "#ff5555",
    "burst"
  );

  if(lives<=0){

    gameOver();

  }else{

    message("😵 VOCÊ FOI PEGO!");

  }

}

/* =====================================================
   ITENS
===================================================== */

function updateItems(){

  for(
    var i=0;
    i<world.eggs.length;
    i++
  ){

    var egg=world.eggs[i];

    egg.pulse+=.08;

    if(
      !egg.collected &&
      Math.hypot(
        egg.x-chicken.x,
        egg.y-chicken.y
      )<35
    ){

      egg.collected=true;

      eggs++;
      score+=100;

      particle(
        egg.x,
        egg.y,
        "#fff2a0",
        "burst"
      );

      message("🥚 +100!");

      updateHUD();

    }

  }

  /* saída */

  var ex=world.exit;

  if(
    chicken.x>ex.x-20 &&
    chicken.x<ex.x+ex.w+20 &&
    chicken.y>ex.y-20 &&
    chicken.y<ex.y+ex.h+20
  ){

    var collected=0;

    for(
      var j=0;
      j<world.eggs.length;
      j++
    ){

      if(world.eggs[j].collected){
        collected++;
      }

    }

    if(
      collected>=
      Math.ceil(world.eggs.length*.45)
    ){

      nextLevel();

    }else{

      message("🥚 Pegue mais ovos!");

    }

  }

}

/* =====================================================
   PRÓXIMA FASE
===================================================== */

function nextLevel(){

  score+=500*level;

  if(level<6){

    level++;

    createLevel();

    updateHUD();

  }else{

    victory();

  }

}

/* =====================================================
   VITÓRIA
===================================================== */

function victory(){

  playing=false;

  saveBest();

  document
    .getElementById("hud")
    .classList.add("hidden");

  document
    .getElementById("pause")
    .classList.add("hidden");

  document
    .getElementById("endIcon")
    .textContent="🐔🏆";

  document
    .getElementById("endTitle")
    .textContent="VOCÊ ESCAPOU!";

  document
    .getElementById("endText")
    .innerHTML=
      "A galinha chegou à estrada!<br><br>"+
      "🏆 Pontuação: <b>"+score+"</b><br>"+
      "🥚 Ovos: <b>"+eggs+"</b><br><br>"+
      "A fazenda nunca mais será a mesma! 😂";

  document
    .getElementById("end")
    .classList.remove("hidden");

}

/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

  playing=false;

  saveBest();

  document
    .getElementById("hud")
    .classList.add("hidden");

  document
    .getElementById("pause")
    .classList.add("hidden");

  document
    .getElementById("endIcon")
    .textContent="😵🐔";

  document
    .getElementById("endTitle")
    .textContent="A GALINHA FOI PEGA!";

  document
    .getElementById("endText")
    .innerHTML=
      "A fuga terminou!<br><br>"+
      "🏆 Pontuação: <b>"+score+"</b><br>"+
      "🌾 Você chegou até a fase <b>"+level+"</b>.";

  document
    .getElementById("end")
    .classList.remove("hidden");

}

   MENSAGEM
===================================================== */

var messageTimeout;

function message(text){

  var el=document.getElementById("msg");

  el.textContent=text;
  el.style.opacity="1";

  clearTimeout(messageTimeout);

  messageTimeout=setTimeout(function(){

    el.style.opacity="0";

  },1800);

}

/* =====================================================
   PARTÍCULAS
===================================================== */

function particle(x,y,color,type){

  var amount=
    type==="burst"
    ? 18
    : 3;

  for(
    var i=0;
    i<amount;
    i++
  ){

    particles.push({

      x:x,
      y:y,

      vx:(Math.random()-.5)*7,
      vy:(Math.random()-.5)*7,

      life:40+Math.random()*30,

      size:2+Math.random()*4,

      color:color

    });

  }

}

function updateParticles(){

  for(
    var i=particles.length-1;
    i>=0;
    i--
  ){

    var p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;

    p.vy+=.08;

    p.life--;

    if(p.life<=0){
      particles.splice(i,1);
    }

  }

}

/* =====================================================
   CÂMERA
===================================================== */

function updateCamera(){

  var targetX=chicken.x-W/2;
  var targetY=chicken.y-H/2;

  camera.x+=(targetX-camera.x)*.08;
  camera.y+=(targetY-camera.y)*.08;

  camera.x=Math.max(
    0,
    Math.min(
      camera.x,
      Math.max(0,world.width-W)
    )
  );

  camera.y=Math.max(
    0,
    Math.min(
      camera.y,
      Math.max(0,world.height-H)
    )
  );

}

/* =====================================================
   DESENHAR
===================================================== */

function draw(){

  ctx.clearRect(0,0,W,H);

  ctx.save();

  ctx.translate(
    -camera.x,
    -camera.y
  );

  /* chão */

  ctx.fillStyle=
    level>=5
    ? "#263729"
    : "#4f7b3c";

  ctx.fillRect(
    0,
    0,
    world.width,
    world.height
  );

  /* linhas */

  ctx.strokeStyle=
    "rgba(220,240,170,.12)";

  ctx.lineWidth=2;

  for(
    var x=0;
    x<world.width;
    x+=64
  ){

    ctx.beginPath();

    ctx.moveTo(x,0);
    ctx.lineTo(x,world.height);

    ctx.stroke();

  }

  for(
    var y=0;
    y<world.height;
    y+=64
  ){

    ctx.beginPath();

    ctx.moveTo(0,y);
    ctx.lineTo(world.width,y);

    ctx.stroke();

  }

  drawObstacles();
  drawBushes();
  drawEggs();
  drawExit();
  drawEnemies();
  drawChicken();
  drawParticles();

  ctx.restore();

}

/* =====================================================
   OBSTÁCULOS
===================================================== */

function drawObstacles(){

  for(
    var i=0;
    i<world.obstacles.length;
    i++
  ){

    var o=world.obstacles[i];

    if(
      o.x<0 ||
      o.y<0 ||
      o.x+o.w>world.width ||
      o.y+o.h>world.height
    )continue;

    ctx.fillStyle="#704e30";

    ctx.fillRect(
      o.x,
      o.y,
      o.w,
      o.h
    );

    ctx.fillStyle="#936b42";

    ctx.fillRect(
      o.x,
      o.y,
      o.w,
      10
    );

    ctx.strokeStyle=
      "rgba(0,0,0,.3)";

    ctx.strokeRect(
      o.x,
      o.y,
      o.w,
      o.h
    );

    if(
      o.w>130 &&
      o.h>80
    ){

      ctx.fillStyle="#8cc5c7";

      ctx.fillRect(
        o.x+25,
        o.y+30,
        35,
        30
      );

      ctx.fillRect(
        o.x+o.w-60,
        o.y+30,
        35,
        30
      );

    }

  }

}

/* =====================================================
   MOITAS
===================================================== */

function drawBushes(){

  for(
    var i=0;
    i<world.bushes.length;
    i++
  ){

    var b=world.bushes[i];

    ctx.fillStyle="#285e2d";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      b.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#3e7c38";

    ctx.beginPath();

    ctx.arc(
      b.x-12,
      b.y-8,
      b.r*.55,
      0,
      Math.PI*2
    );

    ctx.arc(
      b.x+13,
      b.y-6,
      b.r*.5,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}

/* =====================================================
   OVOS
===================================================== */

function drawEggs(){

  for(
    var i=0;
    i<world.eggs.length;
    i++
  ){

    var e=world.eggs[i];

    if(e.collected)continue;

    var bob=Math.sin(e.pulse)*3;

    ctx.fillStyle="#fff6d5";

    ctx.beginPath();

    ctx.ellipse(
      e.x,
      e.y+bob,
      11,
      15,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}

/* =====================================================
   SAÍDA
===================================================== */

function drawExit(){

  var e=world.exit;

  ctx.fillStyle="#4d301d";

  ctx.fillRect(
    e.x,
    e.y,
    e.w,
    e.h
  );

  ctx.fillStyle="#93663b";

  ctx.fillRect(
    e.x+7,
    e.y+8,
    e.w-14,
    e.h-8
  );

  ctx.fillStyle="#ffe269";

  ctx.beginPath();

  ctx.arc(
    e.x+e.w-13,
    e.y+e.h/2,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="white";
  ctx.font="bold 18px Arial";
  ctx.textAlign="center";

  ctx.fillText(
    "SAÍDA",
    e.x+e.w/2,
    e.y-10
  );

}

/* =====================================================
   INIMIGOS
===================================================== */

function drawEnemies(){

  for(
    var i=0;
    i<world.enemies.length;
    i++
  ){

    var e=world.enemies[i];

    ctx.save();

    ctx.translate(
      e.x,
      e.y
    );

    if(e.type==="dog"){

      ctx.fillStyle="#70452d";

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        22,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.fillStyle="#4b2c1c";

      ctx.beginPath();

      ctx.moveTo(-13,-13);
      ctx.lineTo(-27,-28);
      ctx.lineTo(-7,-20);

      ctx.fill();

      ctx.beginPath();

      ctx.moveTo(13,-13);
      ctx.lineTo(27,-28);
      ctx.lineTo(7,-20);

      ctx.fill();

      ctx.fillStyle="white";

      ctx.beginPath();

      ctx.arc(
        -7,
        -3,
        5,
        0,
        Math.PI*2
      );

      ctx.arc(
        7,
        -3,
        5,
        0,
        Math.PI*2
      );

      ctx.fill();

    }else{

      ctx.fillStyle="#4a301d";

      ctx.fillRect(
        -27,
        -27,
        54,
        10
      );

      ctx.fillRect(
        -15,
        -40,
        30,
        17
      );

      ctx.fillStyle="#9a5c35";

      ctx.fillRect(
        -18,
        -8,
        36,
        38
      );

      ctx.fillStyle="#d59a65";

      ctx.beginPath();

      ctx.arc(
        0,
        -10,
        20,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.fillStyle="#111";

      ctx.beginPath();

      ctx.arc(
        -7,
        -12,
        3,
        0,
        Math.PI*2
      );

      ctx.arc(
        7,
        -12,
        3,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

    if(e.state==="chase"){

      ctx.fillStyle="#ff4040";

      ctx.font="bold 25px Arial";

      ctx.textAlign="center";

      ctx.fillText(
        "!",
        0,
        -45
      );

    }

    ctx.restore();

  }

}

/* =====================================================
   GALINHA
===================================================== */

function drawChicken(){

  ctx.save();

  ctx.translate(
    chicken.x,
    chicken.y
  );

  if(
    chicken.invincible>0 &&
    chicken.invincible%10<5
  ){

    ctx.globalAlpha=.4;

  }

  /* sombra */

  ctx.fillStyle=
    "rgba(0,0,0,.25)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    23,
    25,
    8,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* corpo */

  ctx.fillStyle="#f4f0d8";

  ctx.beginPath();

  ctx.ellipse(
    0,
    3,
    25,
    22,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* asa */

  ctx.fillStyle="#ddd9bf";

  ctx.beginPath();

  ctx.ellipse(
    -8,
    7,
    12,
    8,
    -.4,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* cabeça */

  ctx.fillStyle="#fff9e7";

  ctx.beginPath();

  ctx.arc(
    8,
    -18,
    17,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* crista */

  ctx.fillStyle="#e84444";

  ctx.beginPath();

  ctx.arc(
    2,
    -34,
    6,
    0,
    Math.PI*2
  );

  ctx.arc(
    10,
    -36,
    6,
    0,
    Math.PI*2
  );

  ctx.arc(
    18,
    -33,
    6,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* bico */

  ctx.fillStyle="#f1a332";

  ctx.beginPath();

  ctx.moveTo(23,-18);
  ctx.lineTo(38,-12);
  ctx.lineTo(23,-7);

  ctx.closePath();

  ctx.fill();

  /* olho */

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    14,
    -22,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* pernas */

  ctx.strokeStyle="#df9f3b";
  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(-7,21);
  ctx.lineTo(-9,32);

  ctx.moveTo(8,21);
  ctx.lineTo(10,32);

  ctx.stroke();

  /* impulso */

  if(chicken.dash>0){

    ctx.strokeStyle="#fff36a";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(-25,0);
    ctx.lineTo(-50,0);

    ctx.moveTo(-23,10);
    ctx.lineTo(-43,17);

    ctx.stroke();

  }

  ctx.restore();

}

/* =====================================================
   PARTÍCULAS
===================================================== */

function drawParticles(){

  for(
    var i=0;
    i<particles.length;
    i++
  ){

    var p=particles[i];

    ctx.globalAlpha=
      Math.max(0,p.life/70);

    ctx.fillStyle=p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.globalAlpha=1;

}

/* =====================================================
   LOOP PRINCIPAL
===================================================== */

function gameLoop(){

  if(
    playing &&
    !paused
  ){

    moveChicken();
    updateEnemies();
    updateItems();
    updateParticles();
    updateCamera();

  }

  draw();

  requestAnimationFrame(gameLoop);

}

document.addEventListener(
  "keydown",
  function(e){

    if(
      e.key==="w" ||
      e.key==="W" ||
      e.key==="ArrowUp"
    ){
      keys.up=true;
    }

    if(
      e.key==="s" ||
      e.key==="S" ||
      e.key==="ArrowDown"
    ){
      keys.down=true;
    }

    if(
      e.key==="a" ||
      e.key==="A" ||
      e.key==="ArrowLeft"
    ){
      keys.left=true;
    }

    if(
      e.key==="d" ||
      e.key==="D" ||
      e.key==="ArrowRight"
    ){
      keys.right=true;
    }

    if(e.code==="Space"){

      e.preventDefault();

      dash();

    }

    if(
      e.key==="e" ||
      e.key==="E"
    ){

      chickenNoise();

    }

    if(e.key==="Escape"){

      togglePause();

    }

  }
);

document.addEventListener(
  "keyup",
  function(e){

    if(
      e.key==="w" ||
      e.key==="W" ||
      e.key==="ArrowUp"
    ){
      keys.up=false;
    }

    if(
      e.key==="s" ||
      e.key==="S" ||
      e.key==="ArrowDown"
    ){
      keys.down=false;
    }

    if(
      e.key==="a" ||
      e.key==="A" ||
      e.key==="ArrowLeft"
    ){
      keys.left=false;
    }

    if(
      e.key==="d" ||
      e.key==="D" ||
      e.key==="ArrowRight"
    ){
      keys.right=false;
    }

  }
);

var touchButtons=

touchButtons.forEach(function(button){

  button.addEventListener(

      e.preventDefault();

      keys[key]=true;

    }
  );

  button.addEventListener(
    "pointerup",

      e.preventDefault();

      keys[key]=false;

    }
  );

  button.addEventListener(
    "pointercancel",

      keys[key]=false;

    }
  );

  button.addEventListener(
    "pointerleave",
    function(){

      keys[key]=false;

    }
  );

});
