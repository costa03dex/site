<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABYSS — O Peixe do Abismo</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #020b14;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background:
        radial-gradient(circle at center, #06345c, #01111f 75%);
}

#menu,
#gameOver {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0, 8, 18, 0.9);
    z-index: 10;
    text-align: center;
}

#gameOver {
    display: none;
}

h1 {
    font-size: clamp(42px, 8vw, 90px);
    color: #ff7b21;
    text-shadow: 0 0 25px #ff4d00;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 18px;
    color: #a9dfff;
    margin-bottom: 30px;
}

button {
    border: none;
    padding: 15px 35px;
    border-radius: 12px;
    background: #ff6a00;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255, 106, 0, 0.5);
    transition: .2s;
}

button:hover {
    transform: scale(1.06);
    background: #ff7f24;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}

.hudBox {
    background: rgba(0, 15, 30, .75);
    border: 1px solid rgba(100, 200, 255, .3);
    padding: 10px 15px;
    border-radius: 12px;
    backdrop-filter: blur(5px);
    font-size: 15px;
}

#controls {
    position: fixed;
    bottom: 15px;
    left: 15px;
    color: #9edcff;
    font-size: 13px;
    background: rgba(0, 15, 30, .6);
    padding: 8px 12px;
    border-radius: 8px;
    z-index: 5;
}

.warning {
    margin-top: 20px;
    color: #ffb06c;
    font-size: 13px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div class="hudBox">
        🐟 Tamanho: <span id="size">35</span>
    </div>

    <div class="hudBox">
        ⭐ Pontos: <span id="score">0</span>
    </div>

    <div class="hudBox">
        ❤️ Vidas: <span id="life">3</span>
    </div>
</div>

<div id="controls">
    🎮 WASD ou setas para nadar
</div>

<div id="menu">

    <h1>ABYSS</h1>

    <div class="subtitle">
        O PEIXE DO ABISMO
    </div>

    <button onclick="startGame()">
        🌊 COMEÇAR
    </button>

    <div class="warning">
        Coma criaturas menores e sobreviva às profundezas.
    </div>

</div>

<div id="gameOver">

    <h1>💀 FIM</h1>

    <div class="subtitle">
        Você foi derrotado pelo abismo.
    </div>

    <div style="font-size:22px;margin-bottom:25px;">
        Pontuação: <b id="finalScore">0</b>
    </div>

    <button onclick="startGame()">
        🔄 JOGAR NOVAMENTE
    </button>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {

    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

}

window.addEventListener("resize", resize);
resize();


// ======================================================
// ESTADO DO JOGO
// ======================================================

let gameRunning = false;

let score = 0;
let life = 3;

let worldTime = 0;
let spawnTimer = 0;

let entities = [];
let bubbles = [];


// ======================================================
// TECLAS
// ======================================================

const keys = {};

window.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if (
        ["arrowup", "arrowdown", "arrowleft", "arrowright", " "]
        .includes(e.key.toLowerCase())
    ) {
        e.preventDefault();
    }

});

window.addEventListener("keyup", e => {

    keys[e.key.toLowerCase()] = false;

});


// ======================================================
// JOGADOR
// ======================================================

let player = {

    x: W / 2,
    y: H / 2,

    size: 35,

    // Velocidade atual
    vx: 0,
    vy: 0,

    // Velocidade máxima
    maxSpeed: 3.2,

    // Quanto acelera
    acceleration: 0.12,

    // Quanto desacelera
    friction: 0.94,

    direction: 1,

    // Animação da natação
    swimTime: 0,

    invincible: 0

};


// ======================================================
// COMEÇAR
// ======================================================

function startGame() {

    score = 0;
    life = 3;

    entities = [];
    bubbles = [];

    player.x = W / 2;
    player.y = H / 2;

    player.size = 35;

    player.vx = 0;
    player.vy = 0;

    player.direction = 1;

    player.swimTime = 0;

    player.invincible = 0;

    spawnTimer = 0;
    worldTime = 0;

    gameRunning = true;

    document.getElementById("menu").style.display = "none";
    document.getElementById("gameOver").style.display = "none";

    updateHUD();

    for (let i = 0; i < 12; i++) {
        spawnEntity();
    }

}


// ======================================================
// CRIAR CRIATURAS
// ======================================================

function spawnEntity() {

    const types = [
        "fish",
        "fish",
        "fish",
        "human",
        "shark",
        "mine"
    ];

    const type =
        types[Math.floor(Math.random() * types.length)];

    let size;
    let speed;

    if (type === "fish") {

        size =
            10 +
            Math.random() * 20;

        speed =
            0.5 +
            Math.random() * 1;

    }

    else if (type === "human") {

        size = 17;

        speed =
            0.4 +
            Math.random() * .6;

    }

    else if (type === "shark") {

        size = 45;

        speed =
            0.7 +
            Math.random() * .5;

    }

    else {

        size = 20;

        speed = 0;

    }

    let x;
    let y;

    // Nasce fora da tela
    const side =
        Math.floor(Math.random() * 4);

    if (side === 0) {

        x = -100;
        y = Math.random() * H;

    }

    else if (side === 1) {

        x = W + 100;
        y = Math.random() * H;

    }

    else if (side === 2) {

        x = Math.random() * W;
        y = -100;

    }

    else {

        x = Math.random() * W;
        y = H + 100;

    }

    entities.push({

        type,

        x,
        y,

        size,

        speed,

        direction:
            Math.random() > .5
                ? 1
                : -1,

        phase:
            Math.random() * Math.PI * 2

    });

}


// ======================================================
// UPDATE
// ======================================================

function update() {

    worldTime++;

    // ==================================================
    // CONTROLES
    // ==================================================

    let dx = 0;
    let dy = 0;

    if (
        keys["arrowleft"] ||
        keys["a"]
    ) {
        dx -= 1;
    }

    if (
        keys["arrowright"] ||
        keys["d"]
    ) {
        dx += 1;
    }

    if (
        keys["arrowup"] ||
        keys["w"]
    ) {
        dy -= 1;
    }

    if (
        keys["arrowdown"] ||
        keys["s"]
    ) {
        dy += 1;
    }


    // ==================================================
    // ACELERAÇÃO
    // ==================================================

    if (dx !== 0 || dy !== 0) {

        const tamanho =
            Math.hypot(dx, dy);

        dx /= tamanho;
        dy /= tamanho;

        player.vx +=
            dx * player.acceleration;

        player.vy +=
            dy * player.acceleration;

        // Vira para onde está nadando
        if (dx !== 0) {

            player.direction =
                dx > 0 ? 1 : -1;

        }

        // Aumenta animação
        player.swimTime += 0.25;

    }

    else {

        // Desaceleração natural
        player.vx *= player.friction;
        player.vy *= player.friction;

        player.swimTime += 0.08;

    }


    // ==================================================
    // LIMITAR VELOCIDADE
    // ==================================================

    const velocidade =
        Math.hypot(
            player.vx,
            player.vy
        );

    if (
        velocidade >
        player.maxSpeed
    ) {

        player.vx =
            (player.vx / velocidade) *
            player.maxSpeed;

        player.vy =
            (player.vy / velocidade) *
            player.maxSpeed;

    }


    // ==================================================
    // MOVIMENTO
    // ==================================================

    player.x += player.vx;
    player.y += player.vy;


    // ==================================================
    // LIMITES
    // ==================================================

    player.x =
        Math.max(
            player.size,
            Math.min(
                W - player.size,
                player.x
            )
        );

    player.y =
        Math.max(
            player.size,
            Math.min(
                H - player.size,
                player.y
            )
        );


    // ==================================================
    // INVENCIBILIDADE
    // ==================================================

    if (
        player.invincible > 0
    ) {

        player.invincible--;

    }


    // ==================================================
    // SPAWN
    // ==================================================

    spawnTimer++;

    if (
        spawnTimer > 55
    ) {

        spawnTimer = 0;

        spawnEntity();

    }


    // ==================================================
    // INIMIGOS
    // ==================================================

    entities.forEach(e => {

        e.phase += 0.02;


        // TUBARÃO
        if (
            e.type === "shark"
        ) {

            const angle =
                Math.atan2(
                    player.y - e.y,
                    player.x - e.x
                );

            e.x +=
                Math.cos(angle) *
                e.speed;

            e.y +=
                Math.sin(angle) *
                e.speed;

        }


        // OUTROS
        else if (
            e.type !== "mine"
        ) {

            e.x +=
                e.speed *
                e.direction;

            e.y +=
                Math.sin(e.phase) *
                0.4;

        }


        // Mina
        if (
            e.type === "mine"
        ) {

            e.y +=
                Math.sin(e.phase) *
                0.25;

        }

    });


    // ==================================================
    // COLISÕES
    // ==================================================

    for (
        let i = entities.length - 1;
        i >= 0;
        i--
    ) {

        const e =
            entities[i];

        const distance =
            Math.hypot(
                player.x - e.x,
                player.y - e.y
            );


        if (
            distance <
            player.size +
            e.size * .65
        ) {


            // ==========================================
            // PEIXE / HUMANO
            // ==========================================

            if (
                e.type === "fish" ||
                e.type === "human"
            ) {

                if (
                    player.size >=
                    e.size * .9
                ) {

                    score +=
                        e.type === "human"
                            ? 100
                            : 25;

                    player.size +=
                        e.type === "human"
                            ? 3
                            : 1;

                    entities.splice(i, 1);

                    createBubbles(
                        e.x,
                        e.y,
                        10
                    );

                }

            }


            // ==========================================
            // PERIGO
            // ==========================================

            else {

                if (
                    player.invincible <= 0
                ) {

                    life--;

                    player.invincible =
                        100;

                    player.size =
                        Math.max(
                            20,
                            player.size - 3
                        );

                    createBubbles(
                        player.x,
                        player.y,
                        15
                    );


                    if (
                        life <= 0
                    ) {

                        endGame();

                        return;

                    }

                }

            }

        }

    }


    // ==================================================
    // BOLHAS
    // ==================================================

    bubbles.forEach(b => {

        b.y -= b.speed;

        b.x +=
            Math.sin(
                b.phase
            ) * .2;

        b.phase += .03;

    });


    bubbles =
        bubbles.filter(
            b => b.y > -20
        );


    updateHUD();

}


// ======================================================
// DESENHAR PEIXE
// ======================================================

function drawPlayer() {

    // Piscada quando toma dano
    if (
        player.invincible > 0 &&
        Math.floor(
            player.invincible / 6
        ) % 2 === 0
    ) {

        return;

    }


    ctx.save();


    ctx.translate(
        player.x,
        player.y
    );


    // ==================================================
    // DIREÇÃO
    // ==================================================

    ctx.scale(
        player.direction,
        1
    );


    // ==================================================
    // VELOCIDADE
    // ==================================================

    const swimming =
        Math.hypot(
            player.vx,
            player.vy
        );


    // ==================================================
    // MOVIMENTO DA CAUDA
    // ==================================================

    const tailWave =
        Math.sin(
            player.swimTime
        ) *
        Math.min(
            .35,
            swimming / 10
        );


    // ==================================================
    // BALANÇO DO CORPO
    // ==================================================

    ctx.rotate(

        Math.sin(
            player.swimTime * .5
        ) *

        Math.min(
            .06,
            swimming / 30
        )

    );


    // ==================================================
    // CAUDA
    // ==================================================

    ctx.save();


    ctx.translate(
        -player.size * .55,
        0
    );


    ctx.rotate(
        tailWave
    );


    ctx.fillStyle =
        "#ff7b21";


    ctx.beginPath();


    ctx.moveTo(
        0,
        0
    );


    ctx.lineTo(
        -player.size * .65,
        -player.size * .55
    );


    ctx.lineTo(
        -player.size * .55,
        player.size * .55
    );


    ctx.closePath();


    ctx.fill();


    ctx.restore();


    // ==================================================
    // CORPO
    // ==================================================

    const gradient =
        ctx.createLinearGradient(
            0,
            -player.size,
            0,
            player.size
        );


    gradient.addColorStop(
        0,
        "#ffd34d"
    );


    gradient.addColorStop(
        1,
        "#ef4f19"
    );


    ctx.fillStyle =
        gradient;


    ctx.beginPath();


    ctx.ellipse(
        0,
        0,
        player.size,
        player.size * .6,
        0,
        0,
        Math.PI * 2
    );


    ctx.fill();


    // ==================================================
    // BARBATANA DE CIMA
    // ==================================================

    ctx.fillStyle =
        "#e94818";


    ctx.beginPath();


    ctx.moveTo(
        -5,
        -player.size * .42
    );


    ctx.lineTo(
        5,
        -player.size * .9
    );


    ctx.lineTo(
        18,
        -player.size * .42
    );


    ctx.closePath();


    ctx.fill();


    // ==================================================
    // BARBATANA DE BAIXO
    // ==================================================

    ctx.beginPath();


    ctx.moveTo(
        -5,
        player.size * .42
    );


    ctx.lineTo(
        8,
        player.size * .78
    );


    ctx.lineTo(
        20,
        player.size * .42
    );


    ctx.closePath();


    ctx.fill();


    // ==================================================
    // OLHO
    // ==================================================

    ctx.fillStyle =
        "white";


    ctx.beginPath();


    ctx.arc(
        player.size * .45,
        -player.size * .18,
        player.size * .16,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.fillStyle =
        "#00131f";


    ctx.beginPath();


    ctx.arc(
        player.size * .5,
        -player.size * .18,
        player.size * .08,
        0,
        Math.PI * 2
    );


    ctx.fill();


    // ==================================================
    // BOCA
    // ==================================================

    ctx.strokeStyle =
        "#42130a";

    ctx.lineWidth = 3;


    ctx.beginPath();


    ctx.arc(
        player.size * .55,
        player.size * .08,
        player.size * .2,
        0,
        Math.PI
    );


    ctx.stroke();


    ctx.restore();

}


// ======================================================
// DESENHAR ENTIDADES
// ======================================================

function drawEntities() {

    entities.forEach(e => {

        ctx.save();

        ctx.translate(
            e.x,
            e.y
        );


        // ==============================================
        // PEIXE
        // ==============================================

        if (
            e.type === "fish"
        ) {

            ctx.scale(
                e.direction,
                1
            );

            ctx.fillStyle =
                "#55c7ff";

            ctx.beginPath();

            ctx.ellipse(
                0,
                0,
                e.size,
                e.size * .55,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.fillStyle =
                "#2999d6";

            ctx.beginPath();

            ctx.moveTo(
                -e.size,
                0
            );

            ctx.lineTo(
                -e.size * 1.6,
                -e.size * .6
            );

            ctx.lineTo(
                -e.size * 1.6,
                e.size * .6
            );

            ctx.closePath();

            ctx.fill();


            ctx.fillStyle =
                "white";

            ctx.beginPath();

            ctx.arc(
                e.size * .45,
                -e.size * .15,
                e.size * .18,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.fillStyle =
                "#001";

            ctx.beginPath();

            ctx.arc(
                e.size * .5,
                -e.size * .15,
                e.size * .08,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }


        // ==============================================
        // HUMANO
        // ==============================================

        else if (
            e.type === "human"
        ) {

            ctx.font =
                "30px Arial";

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";

            ctx.fillText(
                "🤿",
                0,
                0
            );

        }


        // ==============================================
        // TUBARÃO
        // ==============================================

        else if (
            e.type === "shark"
        ) {

            ctx.scale(
                e.direction,
                1
            );


            ctx.fillStyle =
                "#687b8a";


            ctx.beginPath();


            ctx.moveTo(
                -e.size,
                0
            );


            ctx.lineTo(
                -e.size * .3,
                -e.size * .55
            );


            ctx.lineTo(
                e.size,
                0
            );


            ctx.lineTo(
                -e.size * .3,
                e.size * .55
            );


            ctx.closePath();


            ctx.fill();


            // barbatana

            ctx.beginPath();


            ctx.moveTo(
                -5,
                -e.size * .4
            );


            ctx.lineTo(
                5,
                -e.size
            );


            ctx.lineTo(
                18,
                -e.size * .35
            );


            ctx.closePath();


            ctx.fill();


            // olho

            ctx.fillStyle =
                "#ff3030";


            ctx.beginPath();


            ctx.arc(
                e.size * .55,
                -e.size * .18,
                4,
                0,
                Math.PI * 2
            );


            ctx.fill();

        }


        // ==============================================
        // MINA
        // ==============================================

        else if (
            e.type === "mine"
        ) {

            ctx.fillStyle =
                "#252525";


            ctx.beginPath();


            ctx.arc(
                0,
                0,
                e.size,
                0,
                Math.PI * 2
            );


            ctx.fill();


            ctx.strokeStyle =
                "#111";


            ctx.lineWidth = 4;


            for (
                let i = 0;
                i < 8;
                i++
            ) {

                const a =
                    i *
                    Math.PI /
                    4;

                ctx.beginPath();


                ctx.moveTo(
                    Math.cos(a) *
                    e.size,
                    Math.sin(a) *
                    e.size
                );


                ctx.lineTo(
                    Math.cos(a) *
                    e.size * 1.5,
                    Math.sin(a) *
                    e.size * 1.5
                );


                ctx.stroke();

            }


            ctx.fillStyle =
                "#ff3838";


            ctx.beginPath();


            ctx.arc(
                0,
                0,
                5,
                0,
                Math.PI * 2
            );


            ctx.fill();

        }


        ctx.restore();

    });

}


// ======================================================
// BOLHAS
// ======================================================

function createBubbles(
    x,
    y,
    amount
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        bubbles.push({

            x:
                x +
                (Math.random() - .5) *
                40,

            y:
                y +
                (Math.random() - .5) *
                40,

            speed:
                .5 +
                Math.random() *
                1.5,

            phase:
                Math.random() *
                Math.PI * 2

        });

    }

}


function drawBubbles() {

    bubbles.forEach(b => {

        ctx.strokeStyle =
            "rgba(170,230,255,.55)";

        ctx.lineWidth = 1.5;


        ctx.beginPath();


        ctx.arc(
            b.x,
            b.y,
            3 +
            Math.sin(b.phase) * 1,
            0,
            Math.PI * 2
        );


        ctx.stroke();

    });

}


// ======================================================
// FUNDO
// ======================================================

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    gradient.addColorStop(
        0,
        "#073b66"
    );


    gradient.addColorStop(
        .5,
        "#02213b"
    );


    gradient.addColorStop(
        1,
        "#010b15"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    // Luz do fundo

    const glow =
        ctx.createRadialGradient(
            W * .5,
            H * .35,
            20,
            W * .5,
            H * .35,
            H * .8
        );


    glow.addColorStop(
        0,
        "rgba(30,140,210,.18)"
    );


    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        glow;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    // Partículas

    for (
        let i = 0;
        i < 35;
        i++
    ) {

        const x =
            (i * 197) %
            W;

        const y =
            (
                i * 113 +
                worldTime * .15
            ) %
            H;


        ctx.fillStyle =
            "rgba(150,220,255,.15)";


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            1.5,
            0,
            Math.PI * 2
        );


        ctx.fill();

    }

}


// ======================================================
// HUD
// ======================================================

function updateHUD() {

    document.getElementById(
        "size"
    ).textContent =
        Math.floor(player.size);


    document.getElementById(
        "score"
    ).textContent =
        score;


    document.getElementById(
        "life"
    ).textContent =
        life;

}


// ======================================================
// GAME OVER
// ======================================================

function endGame() {

    gameRunning = false;

    document.getElementById(
        "finalScore"
    ).textContent =
        score;

    document.getElementById(
        "gameOver"
    ).style.display =
        "flex";

}


// ======================================================
// LOOP
// ======================================================

function gameLoop() {

    requestAnimationFrame(
        gameLoop
    );


    drawBackground();


    if (
        gameRunning
    ) {

        update();

    }


    drawEntities();

    drawBubbles();

    if (
        gameRunning
    ) {

        drawPlayer();

    }

}


// ======================================================
// INICIAR LOOP
// ======================================================

gameLoop();

</script>

</body>
</html>
