<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>🐔 Fuga da Galinha</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#101810;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    touch-action:none;
}

button{
    border:0;
    border-radius:14px;
    padding:14px 25px;
    margin:6px;
    background:linear-gradient(#7bd34b,#3d8629);
    border-bottom:5px solid #245719;
    color:white;
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
    touch-action:manipulation;
}

button:active{
    transform:translateY(3px);
    border-bottom-width:2px;
}

.hidden{
    display:none!important;
}

/* MENU */

.screen{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at center,
            #507b3c,
            #172619 60%,
            #070b08
        );
}

.menu{
    width:min(650px,94%);
    max-height:90vh;
    overflow:auto;
    text-align:center;
    padding:30px 20px;
    border-radius:25px;

    background:rgba(5,12,7,.96);

    border:2px solid #86ce58;

    box-shadow:
        0 0 50px rgba(110,210,70,.25);
}

.logo{
    font-size:75px;
    margin-bottom:5px;
}

h1{
    color:white;
    font-size:clamp(28px,7vw,50px);
    margin-bottom:8px;
}

.subtitle{
    color:#c5d8bb;
    line-height:1.5;
    margin-bottom:20px;
}

.info{
    color:#9eb398;
    line-height:1.6;
    margin-top:15px;
}

/* MAPAS */

#mapMenu{
    margin-top:15px;
}

.mapGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:15px;
}

.mapButton{
    min-height:90px;
    margin:0;
    border:2px solid rgba(255,255,255,.18);
    border-bottom:4px solid rgba(0,0,0,.3);
    font-size:16px;
}

.mapButton.selected{
    outline:3px solid #fff;
    transform:scale(1.02);
}

/* HUD */

#hud{
    position:fixed;
    top:12px;
    left:12px;
    z-index:30;

    display:flex;
    gap:8px;
    flex-wrap:wrap;

    pointer-events:none;
}

.hud{
    padding:8px 12px;
    border-radius:12px;

    background:rgba(5,10,7,.88);

    border:1px solid rgba(255,255,255,.2);

    color:white;
    font-weight:bold;

    box-shadow:0 3px 10px rgba(0,0,0,.25);
}

#pause{
    position:fixed;
    right:12px;
    top:12px;
    z-index:31;

    margin:0;
    padding:9px 13px;

    font-size:18px;
}

/* MENSAGEM */

#msg{
    position:fixed;
    z-index:35;

    top:75px;
    left:50%;

    transform:translateX(-50%);

    padding:10px 18px;

    border-radius:12px;

    background:rgba(5,10,7,.94);

    border:1px solid white;

    color:white;

    opacity:0;

    pointer-events:none;

    transition:.2s;

    white-space:nowrap;
}

/* MOBILE */

#mobileControls{
    position:fixed;
    z-index:40;

    left:18px;
    bottom:18px;

    width:155px;
    height:155px;

    display:none;
}

.dpad{
    position:absolute;

    width:52px;
    height:52px;

    border-radius:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(10,20,12,.85);

    border:2px solid rgba(255,255,255,.3);

    color:white;

    font-size:22px;

    touch-action:none;
}

.up{
    top:0;
    left:51px;
}

.left{
    top:51px;
    left:0;
}

.down{
    top:102px;
    left:51px;
}

.right{
    top:51px;
    left:102px;
}

#actions{
    position:fixed;

    right:18px;
    bottom:25px;

    z-index:40;

    display:none;

    gap:10px;
}

.action{
    width:65px;
    height:65px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(10,20,12,.88);

    border:2px solid rgba(255,255,255,.3);

    color:white;

    font-size:25px;

    touch-action:none;
}

@media(max-width:800px){

    #mobileControls{
        display:block;
    }

    #actions{
        display:flex;
    }

    .mapGrid{
        grid-template-columns:1fr 1fr;
    }

}

</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- HUD -->

<div id="hud" class="hidden">

    <div class="hud">
        🐔 ❤️ <span id="lifeText">3</span>
    </div>

    <div class="hud">
        🥚 <span id="eggText">0</span>
    </div>

    <div class="hud">
        🏆 <span id="scoreText">0</span>
    </div>

    <div class="hud">
        🗺️ <span id="mapText">FAZENDA</span>
    </div>

</div>

<button id="pause" class="hidden" onclick="togglePause()">
    ⏸️
</button>

<div id="msg"></div>


<!-- MENU -->

<div id="menu" class="screen">

    <div class="menu">

        <div class="logo">
            🐔💨
        </div>

        <h1>
            FUGA DA GALINHA
        </h1>

        <div class="subtitle">
            Fuja, pegue os ovos e atravesse todos os mapas!
        </div>

        <button onclick="startGame()">
            ▶️ JOGAR
        </button>

        <button onclick="toggleMaps()">
            🗺️ MAPAS
        </button>

        <button onclick="showInstructions()">
            ❓ COMO JOGAR
        </button>


        <!-- MAPAS -->

        <div id="mapMenu" class="hidden">

            <div class="info">
                ESCOLHA O MAPA
            </div>

            <div class="mapGrid">

                <button
                    class="mapButton"
                    onclick="selectMap(1)"
                    id="map1"
                >
                    🌾<br>
                    FAZENDA
                </button>

                <button
                    class="mapButton"
                    onclick="selectMap(2)"
                    id="map2"
                >
                    🌽<br>
                    MILHARAL
                </button>

                <button
                    class="mapButton"
                    onclick="selectMap(3)"
                    id="map3"
                >
                    🌲<br>
                    FLORESTA
                </button>

                <button
                    class="mapButton"
                    onclick="selectMap(4)"
                    id="map4"
                >
                    🏜️<br>
                    DESERTO
                </button>

                <button
                    class="mapButton"
                    onclick="selectMap(5)"
                    id="map5"
                >
                    🌙<br>
                    NOITE
                </button>

                <button
                    class="mapButton"
                    onclick="selectMap(6)"
                    id="map6"
                >
                    🛣️<br>
                    ESTRADA
                </button>

            </div>

        </div>


        <!-- INSTRUÇÕES -->

        <div id="instructions" class="info hidden">

            <b>PC</b><br>
            W / ↑ = frente<br>
            S / ↓ = trás<br>
            A / ← = esquerda<br>
            D / → = direita<br><br>

            ESPAÇO = 💨 impulso<br>
            E = 🐔 chamar atenção<br><br>

            <b>Objetivo:</b><br>
            Pegue os ovos 🥚 e encontre a saída 🚪.

        </div>

        <div class="info">
            🏆 Recorde:
            <span id="best">0</span>
        </div>

    </div>

</div>


<!-- FINAL -->

<div id="end" class="screen hidden">

    <div class="menu">

        <div
            class="logo"
            id="endIcon"
        >
            🐔
        </div>

        <h1 id="endTitle">
            FIM
        </h1>

        <div
            class="subtitle"
            id="endText"
        ></div>

        <button onclick="startGame()">
            🔄 JOGAR NOVAMENTE
        </button>

        <button onclick="goMenu()">
            🏠 MENU
        </button>

    </div>

</div>


<!-- CONTROLES MOBILE -->

<div id="mobileControls">

    <div
        class="dpad up"
        data-key="up"
    >
        ▲
    </div>

    <div
        class="dpad left"
        data-key="left"
    >
        ◀
    </div>

    <div
        class="dpad down"
        data-key="down"
    >
        ▼
    </div>

    <div
        class="dpad right"
        data-key="right"
    >
        ▶
    </div>

</div>


<div id="actions">

    <div
        class="action"
        id="dashButton"
    >
        💨
    </div>

    <div
        class="action"
        id="noiseButton"
    >
        🐔
    </div>

</div>


<script>

"use strict";

/* =====================================================
   CANVAS
===================================================== */

var canvas =
    document.getElementById("game");

var ctx =
    canvas.getContext("2d");

var W = 0;
var H = 0;


/* =====================================================
   ESTADO
===================================================== */

var playing = false;

var paused = false;

var lives = 3;

var eggs = 0;

var score = 0;

var selectedMap = 1;

var particles = [];

var messageTimeout;


/* =====================================================
   MAPAS
===================================================== */

var maps = {

    1:{
        name:"FAZENDA",

        sky:"#b8dcff",

        ground:"#5d9144",

        ground2:"#477b35",

        path:"#c7a76b",

        obstacle:"#765333",

        roof:"#a74e36",

        tree:"#2f7135",

        tree2:"#3d873e",

        exit:"#7c5a31",

        night:false
    },

    2:{
        name:"MILHARAL",

        sky:"#91c9ec",

        ground:"#668d35",

        ground2:"#51762c",

        path:"#a89054",

        obstacle:"#80613b",

        roof:"#bb783e",

        tree:"#52752c",

        tree2:"#739a35",

        exit:"#79542b",

        night:false
    },

    3:{
        name:"FLORESTA",

        sky:"#75a98a",

        ground:"#244d32",

        ground2:"#193d27",

        path:"#596044",

        obstacle:"#4a382a",

        roof:"#473d32",

        tree:"#123c25",

        tree2:"#1c5831",

        exit:"#6c5535",

        night:false
    },

    4:{
        name:"DESERTO",

        sky:"#f1c789",

        ground:"#d8a45d",

        ground2:"#c58d49",

        path:"#e5c27c",

        obstacle:"#9c6940",

        roof:"#8d4634",

        tree:"#3f733d",

        tree2:"#56854b",

        exit:"#754b2a",

        night:false
    },

    5:{
        name:"NOITE",

        sky:"#10152d",

        ground:"#202f2b",

        ground2:"#18251f",

        path:"#3c3d3a",

        obstacle:"#423c48",

        roof:"#493448",

        tree:"#102c27",

        tree2:"#164337",

        exit:"#66523a",

        night:true
    },

    6:{
        name:"ESTRADA",

        sky:"#b8c7d0",

        ground:"#53685a",

        ground2:"#46594c",

        path:"#393b3b",

        obstacle:"#62574c",

        roof:"#754638",

        tree:"#2e5934",

        tree2:"#3f7041",

        exit:"#4c3929",

        night:false
    }

};


/* =====================================================
   MUNDO
===================================================== */

var world = {

    width:2200,

    height:1400,

    obstacles:[],

    bushes:[],

    eggs:[],

    enemies:[],

    trees:[],

    decorations:[],

    exit:null

};


/* =====================================================
   GALINHA
===================================================== */

var chicken = {

    x:150,

    y:200,

    r:20,

    vx:0,

    vy:0,

    maxSpeed:4.7,

    acceleration:.42,

    friction:.82,

    dash:0,

    dashCooldown:0,

    invincible:0,

    hidden:false,

    direction:1,

    walk:0

};


/* =====================================================
   CÂMERA
===================================================== */

var camera = {

    x:0,

    y:0,

    shake:0

};


/* =====================================================
   CONTROLES
===================================================== */

var keys = {

    up:false,

    down:false,

    left:false,

    right:false

};


/* =====================================================
   RECORD
===================================================== */

function loadBest(){

    try{

        return Number(
            localStorage.getItem(
                "fugaGalinhaBest"
            )
        ) || 0;

    }catch(e){

        return 0;

    }

}

var bestScore = loadBest();

document.getElementById(
    "best"
).textContent = bestScore;


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width = W;

    canvas.height = H;

}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =====================================================
   SELEÇÃO DE MAPA
===================================================== */

function toggleMaps(){

    document
        .getElementById("mapMenu")
        .classList.toggle("hidden");

}


function selectMap(number){

    selectedMap = number;

    for(
        var i=1;
        i<=6;
        i++
    ){

        document
            .getElementById(
                "map"+i
            )
            .classList.remove(
                "selected"
            );

    }

    document
        .getElementById(
            "map"+number
        )
        .classList.add(
            "selected"
        );

    message(
        "🗺️ "+
        maps[number].name
    );

}


/* =====================================================
   INSTRUÇÕES
===================================================== */

function showInstructions(){

    document
        .getElementById(
            "instructions"
        )
        .classList.toggle(
            "hidden"
        );

}


/* =====================================================
   START
===================================================== */

function startGame(){

    try{

        document
            .getElementById("menu")
            .classList.add(
                "hidden"
            );

        document
            .getElementById("end")
            .classList.add(
                "hidden"
            );

        document
            .getElementById("hud")
            .classList.remove(
                "hidden"
            );

        document
            .getElementById("pause")
            .classList.remove(
                "hidden"
            );

        playing = true;

        paused = false;

        lives = 3;

        eggs = 0;

        score = 0;

        particles = [];

        camera.x = 0;

        camera.y = 0;

        resetKeys();

        createMap();

        updateHUD();

        message(
            "🗺️ "+
            maps[selectedMap].name
        );

    }catch(error){

        console.error(error);

    }

}


/* =====================================================
   CRIAR MAPA
===================================================== */

function createMap(){

    var map =
        maps[selectedMap];

    world.width =
        selectedMap === 6
            ? 2600
            : 2200;

    world.height =
        selectedMap === 3
            ? 1600
            : 1400;

    world.obstacles = [];

    world.bushes = [];

    world.eggs = [];

    world.enemies = [];

    world.trees = [];

    world.decorations = [];


    chicken.x = 160;

    chicken.y = 220;

    chicken.vx = 0;

    chicken.vy = 0;

    chicken.dash = 0;

    chicken.dashCooldown = 0;

    chicken.invincible = 0;


    /*
      BORDAS
    */

    addObstacle(
        -100,
        -100,
        world.width+200,
        80
    );

    addObstacle(
        -100,
        world.height-20,
        world.width+200,
        100
    );

    addObstacle(
        -100,
        -100,
        80,
        world.height+200
    );

    addObstacle(
        world.width-20,
        -100,
        100,
        world.height+200
    );


    /*
      MAPA 1
    */

    if(selectedMap === 1){

        createFarmMap();

    }


    /*
      MAPA 2
    */

    if(selectedMap === 2){

        createCornMap();

    }


    /*
      MAPA 3
    */

    if(selectedMap === 3){

        createForestMap();

    }


    /*
      MAPA 4
    */

    if(selectedMap === 4){

        createDesertMap();

    }


    /*
      MAPA 5
    */

    if(selectedMap === 5){

        createNightMap();

    }


    /*
      MAPA 6
    */

    if(selectedMap === 6){

        createRoadMap();

    }


    createEggs();

    createEnemies();

    createExit();

    updateHUD();

}


/* =====================================================
   MAPA FAZENDA
===================================================== */

function createFarmMap(){

    addObstacle(
        80,70,300,190
    );

    addObstacle(
        530,130,250,150
    );

    addObstacle(
        1020,80,330,190
    );

    addObstacle(
        420,560,300,170
    );

    addObstacle(
        1060,650,300,170
    );


    for(
        var i=0;
        i<28;
        i++
    ){

        addTreeDecoration();

    }


    for(
        var j=0;
        j<22;
        j++
    ){

        addBush();

    }

}


/* =====================================================
   MAPA MILHARAL
===================================================== */

function createCornMap(){

    for(
        var i=0;
        i<8;
        i++
    ){

        addObstacle(
            350+i*190,
            180,
            80,
            700
        );

    }


    for(
        var j=0;
        j<40;
        j++
    ){

        addCornDecoration();

    }


    for(
        var k=0;
        k<15;
        k++
    ){

        addBush();

    }

}


/* =====================================================
   FLORESTA
===================================================== */

function createForestMap(){

    for(
        var i=0;
        i<45;
        i++
    ){

        addTreeDecoration();

    }


    for(
        var j=0;
        j<15;
        j++
    ){

        addObstacle(
            300+
            Math.random()*1400,

            250+
            Math.random()*1000,

            100+
            Math.random()*100,

            80+
            Math.random()*100
        );

    }

}


/* =====================================================
   DESERTO
===================================================== */

function createDesertMap(){

    addObstacle(
        500,220,220,150
    );

    addObstacle(
        1200,700,250,160
    );

    addObstacle(
        1650,300,220,140
    );


    for(
        var i=0;
        i<18;
        i++
    ){

        addCactus();

    }


    for(
        var j=0;
        j<18;
        j++
    ){

        addRock();

    }

}


/* =====================================================
   NOITE
===================================================== */

function createNightMap(){

    addObstacle(
        150,100,300,180
    );

    addObstacle(
        850,250,250,160
    );

    addObstacle(
        1500,650,300,180
    );


    for(
        var i=0;
        i<35;
        i++
    ){

        addTreeDecoration();

    }


    for(
        var j=0;
        j<20;
        j++
    ){

        addStarDecoration();

    }

}


/* =====================================================
   ESTRADA
===================================================== */

function createRoadMap(){

    /*
      Estrada central
    */

    addObstacle(
        0,
        500,
        world.width,
        380
    );


    for(
        var i=0;
        i<28;
        i++
    ){

        addRoadTree(
            100+i*90,
            430
        );

        addRoadTree(
            100+i*90,
            950
        );

    }


    /*
      carros como obstáculos
    */

    for(
        var j=0;
        j<9;
        j++
    ){

        addObstacle(
            250+
            j*260,

            600+
            (j%2)*170,

            110,

            55
        );

    }

}


/* =====================================================
   OBSTÁCULO
===================================================== */

function addObstacle(
    x,
    y,
    w,
    h
){

    world.obstacles.push({

        x:x,
        y:y,
        w:w,
        h:h

    });

}


/* =====================================================
   DECORAÇÕES
===================================================== */

function addTreeDecoration(){

    var p =
        randomFreePoint();

    world.trees.push({

        x:p.x,
        y:p.y,

        size:
            25+
            Math.random()*25

    });

}


function addRoadTree(x,y){

    world.trees.push({

        x:x,
        y:y,

        size:24

    });

}


function addBush(){

    var p =
        randomFreePoint();

    world.bushes.push({

        x:p.x,
        y:p.y,

        r:
            25+
            Math.random()*15

    });

}


function addCornDecoration(){

    var p =
        randomFreePoint();

    world.decorations.push({

        type:"corn",

        x:p.x,
        y:p.y

    });

}


function addCactus(){

    var p =
        randomFreePoint();

    world.decorations.push({

        type:"cactus",

        x:p.x,
        y:p.y

    });

}


function addRock(){

    var p =
        randomFreePoint();

    world.decorations.push({

        type:"rock",

        x:p.x,
        y:p.y

    });

}


function addStarDecoration(){

    var p =
        randomFreePoint();

    world.decorations.push({

        type:"star",

        x:p.x,
        y:p.y

    });

}


/* =====================================================
   PONTO LIVRE
===================================================== */

function randomFreePoint(){

    for(
        var i=0;
        i<150;
        i++
    ){

        var p={

            x:
                100+
                Math.random()*
                (world.width-200),

            y:
                100+
                Math.random()*
                (world.height-200)

        };


        var blocked=false;


        for(
            var j=0;
            j<world.obstacles.length;
            j++
        ){

            if(
                circleRect(
                    p.x,
                    p.y,
                    35,
                    world.obstacles[j]
                )
            ){

                blocked=true;

                break;

            }

        }


        if(
            !blocked &&
            Math.hypot(
                p.x-chicken.x,
                p.y-chicken.y
            )>180
        ){

            return p;

        }

    }


    return{

        x:
            400+
            Math.random()*800,

        y:
            400+
            Math.random()*500

    };

}


/* =====================================================
   OVOS
===================================================== */

/* =====================================================
   MOVIMENTO DA GALINHA
===================================================== */

function moveChicken(){

    var ax=0;

    var ay=0;


    if(keys.up)
        ay-=1;

    if(keys.down)
        ay+=1;

    if(keys.left)
        ax-=1;

    if(keys.right)
        ax+=1;


    /*
      Normaliza para não andar
      mais rápido na diagonal.
    */

    if(ax!==0 || ay!==0){

        var len =
            Math.hypot(
                ax,
                ay
            );

        ax/=len;

        ay/=len;


        /*
          ACELERAÇÃO
        */

        chicken.vx +=
            ax*
            chicken.acceleration;

        chicken.vy +=
            ay*
            chicken.acceleration;


        chicken.walk+=.25;


        if(Math.abs(ax)>.1){

            chicken.direction =
                ax>0 ? 1 : -1;

        }

    }else{

        /*
          DESACELERAÇÃO
        */

        chicken.vx *=
            chicken.friction;

        chicken.vy *=
            chicken.friction;

    }


    /*
      LIMITAR VELOCIDADE
    */

    var speed =
        Math.hypot(
            chicken.vx,
            chicken.vy
        );


    var max =
        chicken.dash>0
            ? 10
            : chicken.maxSpeed;


    if(speed>max){

        chicken.vx =
            chicken.vx/speed*max;

        chicken.vy =
            chicken.vy/speed*max;

    }


    moveChickenCollision();


    if(
        chicken.dash>0
    ){

        chicken.dash--;

        particle(
            chicken.x,
            chicken.y,
            "#fff36a"
        );

    }


    if(
        chicken.dashCooldown>0
    ){

        chicken.dashCooldown--;

    }


    if(
        chicken.invincible>0
    ){

        chicken.invincible--;

    }


    /*
      ESCONDER
    */

    chicken.hidden=false;


    for(
        var i=0;
        i<world.bushes.length;
        i++
    ){

        var b =
            world.bushes[i];

        if(
            Math.hypot(
                chicken.x-b.x,
                chicken.y-b.y
            )<b.r
        ){

            chicken.hidden=true;

            break;

        }

    }

}


/* =====================================================
   COLISÃO GALINHA
===================================================== */

function moveChickenCollision(){

    var oldX =
        chicken.x;

    var oldY =
        chicken.y;


    chicken.x +=
        chicken.vx;


    if(
        isBlocked(
            chicken.x,
            chicken.y,
            chicken.r
        )
    ){

        chicken.x =
            oldX;

        chicken.vx *= -.15;

    }


    chicken.y +=
        chicken.vy;


    if(
        isBlocked(
            chicken.x,
            chicken.y,
            chicken.r
        )
    ){

        chicken.y =
            oldY;

        chicken.vy *= -.15;

    }

}


/* =====================================================
   BLOQUEIO
===================================================== */

function isBlocked(
    x,
    y,
    r
){

    for(
        var i=0;
        i<world.obstacles.length;
        i++
    ){

        if(
            circleRect(
                x,
                y,
                r,
                world.obstacles[i]
            )
        ){

            return true;

        }

    }

    return false;

}


/* =====================================================
   DASH
===================================================== */

function dash(){

    if(
        !playing ||
        paused ||
        chicken.dashCooldown>0
    ){

        return;

    }


    var dx=0;

    var dy=0;


    if(keys.left)
        dx--;

    if(keys.right)
        dx++;

    if(keys.up)
        dy--;

    if(keys.down)
        dy++;


    /*
      Se não apertou direção,
      usa a direção atual.
    */

    if(dx===0 && dy===0){

        dx =
            chicken.direction;

    }


    var len =
        Math.hypot(
            dx,
            dy
        ) || 1;


    dx/=len;

    dy/=len;


    chicken.vx =
        dx*10;

    chicken.vy =
        dy*10;


    chicken.dash=18;

    chicken.dashCooldown=55;


    camera.shake=7;

}


/* =====================================================
   INIMIGOS
===================================================== */

function updateEnemies(){

    for(
        var i=0;
        i<world.enemies.length;
        i++
    ){

        var e =
            world.enemies[i];


        var distance =
            Math.hypot(
                e.x-chicken.x,
                e.y-chicken.y
            );


        /*
          PERSEGUIÇÃO
        */

        if(
            !chicken.hidden &&
            distance<300
        ){

            e.state="chase";

        }


        /*
          SE PERDEU
        */

        if(
            chicken.hidden ||
            distance>520
        ){

            if(
                e.state==="chase"
            ){

                e.state="patrol";

            }

        }


        if(
            e.state==="patrol"
        ){

            if(
                Math.hypot(
                    e.x-e.targetX,
                    e.y-e.targetY
                )<30
            ){

                e.targetX =
                    100+
                    Math.random()*
                    (world.width-200);

                e.targetY =
                    100+
                    Math.random()*
                    (world.height-200);

            }

        }


        if(
            e.state==="chase"
        ){

            e.targetX =
                chicken.x;

            e.targetY =
                chicken.y;

        }


        var dx =
            e.targetX-e.x;

        var dy =
            e.targetY-e.y;


        var len =
            Math.hypot(
                dx,
                dy
            ) || 1;


        dx/=len;

        dy/=len;


        var oldX=e.x;

        var oldY=e.y;


        e.x +=
            dx*e.speed;

        e.y +=
            dy*e.speed;


        if(
            isBlocked(
                e.x,
                e.y,
                e.r
            )
        ){

            e.x=oldX;

            e.y=oldY;

            e.targetX =
                100+
                Math.random()*
                (world.width-200);

            e.targetY =
                100+
                Math.random()*
                (world.height-200);

        }


        /*
          COLISÃO
        */

        if(
            distance<
            e.r+chicken.r &&
            !chicken.hidden &&
            chicken.invincible<=0
        ){

            damage();

        }

    }

}


/* =====================================================
   DANO
===================================================== */

function damage(){

    lives--;

    chicken.invincible=100;

    chicken.vx=0;

    chicken.vy=0;

    chicken.x=160;

    chicken.y=220;

    camera.shake=15;

    particle(
        chicken.x,
        chicken.y,
        "#ff4b4b",
        "burst"
    );

    updateHUD();


    if(lives<=0){

        gameOver();

    }else{

        );

    }

}


/* =====================================================
   ITENS
===================================================== */

function updateItems(){

    /*
      OVOS
    */

    for(
        var i=0;
        i<world.eggs.length;
        i++
    ){

        var e =
            world.eggs[i];

        e.pulse+=.08;


        if(
            !e.collected &&
            Math.hypot(
                e.x-chicken.x,
                e.y-chicken.y
            )<38
        ){

            e.collected=true;

            eggs++;

            score+=100;

            particle(
                e.x,
                e.y,
                "#fff1a0",
                "burst"
            );

            message(
                "🥚 +100"
            );

            updateHUD();

        }

    }


    /*
      SAÍDA
    */

    var ex =
        world.exit;

    if(!ex)return;


    if(
        chicken.x>ex.x-25 &&
        chicken.x<ex.x+ex.w+25 &&
        chicken.y>ex.y-25 &&
        chicken.y<ex.y+ex.h+25
    ){

        var total=0;


        for(
            var j=0;
            j<world.eggs.length;
            j++
        ){

            if(
                world.eggs[j].collected
            ){

                total++;

            }

        }


        if(
            total>=
            Math.ceil(
                world.eggs.length*.5
            )
        ){

            score+=500;

            victoryMap();

        }else{

            message(
                "🥚 Pegue pelo menos metade dos ovos!"
            );

        }

    }

}

/* =====================================================
   PARTÍCULAS
===================================================== */

function particle(
    x,
    y,
    color,
    type
){

    var amount =
        type==="burst"
            ?18
            :2;


    for(
        var i=0;
        i<amount;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)*7,

            vy:
                (Math.random()-.5)*7,

            life:
                30+
                Math.random()*35,

            size:
                2+
                Math.random()*4,

            color:color

        });

    }

}


function updateParticles(){

    for(
        var i=particles.length-1;
        i>=0;
        i--
    ){

        var p =
            particles[i];

        p.x+=p.vx;

        p.y+=p.vy;

        p.vy+=.08;

        p.life--;


        if(p.life<=0){

            particles.splice(
                i,
                1
            );

        }

    }

}


/* =====================================================
   CÂMERA
===================================================== */

function updateCamera(){

    var targetX =
        chicken.x-W/2;

    var targetY =
        chicken.y-H/2;


    camera.x +=
        (
            targetX-camera.x
        )*.10;


    camera.y +=
        (
            targetY-camera.y
        )*.10;


    camera.x =
        Math.max(
            0,
            Math.min(
                camera.x,
                Math.max(
                    0,
                    world.width-W
                )
            )
        );


    camera.y =
        Math.max(
            0,
            Math.min(
                camera.y,
                Math.max(
                    0,
                    world.height-H
                )
            )
        );


    if(camera.shake>0){

        camera.x +=
            (Math.random()-.5)*
            camera.shake;

        camera.y +=
            (Math.random()-.5)*
            camera.shake;

        camera.shake*=.8;

    }

}


/* =====================================================
   DESENHAR
===================================================== */

function draw(){

    var map =
        maps[selectedMap];


    /*
      CÉU / FUNDO
    */

    ctx.fillStyle =
        map.sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.save();


    ctx.translate(
        -camera.x,
        -camera.y
    );


    /*
      CHÃO
    */

    ctx.fillStyle =
        map.ground;

    ctx.fillRect(
        0,
        0,
        world.width,
        world.height
    );


    /*
      TEXTURA DO CHÃO
    */

    ctx.fillStyle =
        map.ground2;


    for(
        var x=0;
        x<world.width;
        x+=80
    ){

        for(
            var y=0;
            y<world.height;
            y+=80
        ){

            if(
                (x+y)%160===0
            ){

                ctx.globalAlpha=.16;

                ctx.fillRect(
                    x,
                    y,
                    35,
                    4
                );

            }

        }

    }

    ctx.globalAlpha=1;


    /*
      ESTRADA
    */

    if(selectedMap===6){

        ctx.fillStyle =
            "#353838";

        ctx.fillRect(
            0,
            500,
            world.width,
            380
        );


        ctx.fillStyle =
            "#d9c35c";


        for(
            var r=0;
            r<world.width;
            r+=100
        ){

            ctx.fillRect(
                r,
                680,
                55,
                8
            );

        }

    }


    drawTrees();

    drawDecorations();

    drawBushes();

    drawObstacles();

    drawEggs();

    drawExit();

    drawEnemies();

    drawChicken();

    drawParticles();


    /*
      NOITE
    */

    if(map.night){

        ctx.fillStyle =
            "rgba(5,8,30,.38)";

        ctx.fillRect(
            camera.x,
            camera.y,
            W,
            H
        );

        drawMoon();

    }


    ctx.restore();

}


/* =====================================================
   ÁRVORE
===================================================== */

function drawTrees(){

    var map =
        maps[selectedMap];


    for(
        var i=0;
        i<world.trees.length;
        i++
    ){

        var t =
            world.trees[i];


        ctx.fillStyle =
            "#70472c";

        ctx.fillRect(
            t.x-6,
            t.y,
            12,
            t.size*1.5
        );


        ctx.fillStyle =
            map.tree;

        ctx.beginPath();

        ctx.arc(
            t.x,
            t.y,
            t.size,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle =
            map.tree2;

        ctx.beginPath();

        ctx.arc(
            t.x-10,
            t.y-8,
            t.size*.55,
            0,
            Math.PI*2
        );

        ctx.arc(
            t.x+12,
            t.y-5,
            t.size*.5,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =====================================================
   DECORAÇÕES
===================================================== */

function drawDecorations(){

    var map =
        maps[selectedMap];


    for(
        var i=0;
        i<world.decorations.length;
        i++
    ){

        var d =
            world.decorations[i];


        /*
          MILHO
        */

        if(d.type==="corn"){

            ctx.strokeStyle=
                "#6b8e29";

            ctx.lineWidth=3;

            ctx.beginPath();

            ctx.moveTo(
                d.x,
                d.y+20
            );

            ctx.lineTo(
                d.x,
                d.y-15
            );

            ctx.stroke();


            ctx.fillStyle=
                "#e7c943";

            ctx.beginPath();

            ctx.ellipse(
                d.x+5,
                d.y-5,
                6,
                12,
                -.2,
                0,
                Math.PI*2
            );

            ctx.fill();

        }


        /*
          CACTO
        */

        if(d.type==="cactus"){

            ctx.fillStyle=
                "#4d8c46";

            ctx.fillRect(
                d.x-7,
                d.y-25,
                14,
                50
            );

            ctx.fillRect(
                d.x-22,
                d.y-5,
                15,
                9
            );

            ctx.fillRect(
                d.x+7,
                d.y+4,
                15,
                9
            );

        }


        /*
          PEDRA
        */

        if(d.type==="rock"){

            ctx.fillStyle=
                "#81725f";

            ctx.beginPath();

            ctx.ellipse(
                d.x,
                d.y,
                17,
                11,
                -.2,
                0,
                Math.PI*2
            );

            ctx.fill();

        }


        /*
          ESTRELA
        */

        if(d.type==="star"){

            ctx.fillStyle=
                "#fff2a0";

            ctx.beginPath();

            ctx.arc(
                d.x,
                d.y,
                2,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }

}

/* =====================================================
   OBSTÁCULOS
===================================================== */

function drawObstacles(){

    var map =
        maps[selectedMap];


    for(
        var i=0;
        i<world.obstacles.length;
        i++
    ){

        var o =
            world.obstacles[i];


        /*
          NÃO desenhar bordas
        */

        if(
            o.x<0 ||
            o.y<0 ||
            o.x+o.w>world.width ||
            o.y+o.h>world.height
        ){

            continue;

        }


        ctx.fillStyle =
            map.obstacle;

        ctx.fillRect(
            o.x,
            o.y,
            o.w,
            o.h
        );


        ctx.fillStyle =
            map.roof;

        ctx.fillRect(
            o.x,
            o.y,
            o.w,
            12
        );


        ctx.strokeStyle =
            "rgba(0,0,0,.3)";

        ctx.strokeRect(
            o.x,
            o.y,
            o.w,
            o.h
        );


        if(
            o.w>130 &&
            o.h>80
        ){

            ctx.fillStyle=
                selectedMap===5
                    ?"#777c9e"
                    :"#8cc5c7";


            ctx.fillRect(
                o.x+25,
                o.y+35,
                35,
                30
            );


            ctx.fillRect(
                o.x+o.w-60,
                o.y+35,
                35,
                30
            );

        }

    }

}


/* =====================================================
   OVOS
===================================================== */

function drawEggs(){

    for(
        var i=0;
        i<world.eggs.length;
        i++
    ){

        var e =
            world.eggs[i];

        if(e.collected)
            continue;


        var bob =
            Math.sin(
                e.pulse
            )*3;


        ctx.fillStyle=
            "#fff4d2";


        ctx.beginPath();

        ctx.ellipse(
            e.x,
            e.y+bob,
            11,
            15,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.strokeStyle=
            "rgba(0,0,0,.15)";

        ctx.stroke();

    }

}

    );

/* =====================================================
   GALINHA
===================================================== */

function drawChicken(){

    ctx.save();

    ctx.translate(
        chicken.x,
        chicken.y
    );


    /*
      Pequena inclinação
      conforme movimento.
    */

    var tilt =
        chicken.vx*.025;

    ctx.rotate(
        tilt
    );


    if(
        chicken.invincible>0 &&
        chicken.invincible%10<5
    ){

        ctx.globalAlpha=.45;

    }


    /*
      SOMBRA
    */

    ctx.fillStyle=
        "rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        24,
        25,
        8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
      CORPO
    */

    ctx.fillStyle=
        "#f4f0d8";

    ctx.beginPath();

    ctx.ellipse(
        0,
        3,
        25,
        22,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
      ASA
    */

    ctx.fillStyle=
        "#ddd9bf";

    ctx.beginPath();

    ctx.ellipse(
        -8,
        7,
        12,
        8,
        -.4,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
      CABEÇA
    */

    ctx.fillStyle=
        "#fff9e7";

    ctx.beginPath();

    ctx.arc(
        8,
        -18,
        17,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
      CRISTA
    */

    ctx.fillStyle=
        "#e84444";

    ctx.beginPath();

    ctx.arc(
        2,
        -34,
        6,
        0,
        Math.PI*2
    );

    ctx.arc(
        10,
        -36,
        6,
        0,
        Math.PI*2
    );

    ctx.arc(
        18,
        -33,
        6,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
      BICO
    */

    ctx.fillStyle=
        "#f1a332";

    ctx.beginPath();

    ctx.moveTo(
        23,
        -18
    );

    ctx.lineTo(
        38,
        -12
    );

    ctx.lineTo(
        23,
        -7
    );

    ctx.closePath();

    ctx.fill();


    /*
      OLHO
    */

    ctx.fillStyle=
        "#111";

    ctx.beginPath();

    ctx.arc(
        14,
        -22,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
      PERNAS
    */

    var leg =
        Math.sin(
            chicken.walk
        )*3;


    ctx.strokeStyle=
        "#df9f3b";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(
        -7,
        21
    );

    ctx.lineTo(
        -9+leg,
        32
    );

    ctx.moveTo(
        8,
        21
    );

    ctx.lineTo(
        10-leg,
        32
    );

    ctx.stroke();


    /*
      DASH
    */

    if(
        chicken.dash>0
    ){

        ctx.strokeStyle=
            "#fff36a";

        ctx.lineWidth=4;

        ctx.beginPath();

        ctx.moveTo(
            -25,
            0
        );

        ctx.lineTo(
            -55,
            0
        );

        ctx.moveTo(
            -23,
            10
        );

        ctx.lineTo(
            -48,
            18
        );

        ctx.stroke();

    }


    ctx.restore();

}


/* =====================================================
   PARTÍCULAS
===================================================== */

function drawParticles(){

    for(
        var i=0;
        i<particles.length;
        i++
    ){

        var p =
            particles[i];


        ctx.globalAlpha=
            Math.max(
                0,
                p.life/65
            );


        ctx.fillStyle=
            p.color;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;

}


/* =====================================================
   COLISÃO CÍRCULO
===================================================== */

function circleRect(
    cx,
    cy,
    r,
    o
){

    var nx =
        Math.max(
            o.x,
            Math.min(
                cx,
                o.x+o.w
            )
        );


    var ny =
        Math.max(
            o.y,
            Math.min(
                cy,
                o.y+o.h
            )
        );


    var dx =
        cx-nx;

    var dy =
        cy-ny;


    return (
        dx*dx+
        dy*dy
    )<r*r;

}


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        var k =
            e.key.toLowerCase();


        if(
            k==="w" ||
            e.key==="ArrowUp"
        ){

            keys.up=true;

            e.preventDefault();

        }


        if(
            k==="s" ||
            e.key==="ArrowDown"
        ){

            keys.down=true;

            e.preventDefault();

        }


        if(
            k==="a" ||
            e.key==="ArrowLeft"
        ){

            keys.left=true;

            e.preventDefault();

        }


        if(
            k==="d" ||
            e.key==="ArrowRight"
        ){

            keys.right=true;

            e.preventDefault();

        }


        if(
            e.code==="Space"
        ){

            e.preventDefault();

            dash();

        }


        if(k==="e"){

            message(
                "🐔 COCÓÓÓÓÓ!"
            );

        }


        if(
            e.key==="Escape"
        ){

            togglePause();

        }

    }
);


document.addEventListener(
    "keyup",
    function(e){

        var k =
            e.key.toLowerCase();


        if(
            k==="w" ||
            e.key==="ArrowUp"
        ){

            keys.up=false;

        }


        if(
            k==="s" ||
            e.key==="ArrowDown"
        ){

            keys.down=false;

        }


        if(
            k==="a" ||
            e.key==="ArrowLeft"
        ){

            keys.left=false;

        }


        if(
            k==="d" ||
            e.key==="ArrowRight"
        ){

            keys.right=false;

        }

    }
);


/* =====================================================
   MOBILE
===================================================== */

var touchButtons =
    document.querySelectorAll(
        ".dpad"
    );


touchButtons.forEach(
    function(button){

        var key =
            button.dataset.key;


        function press(e){

            e.preventDefault();

            keys[key]=true;

            try{

                button.setPointerCapture(
                    e.pointerId
                );

            }catch(error){}

        }


        function release(e){

            e.preventDefault();

            keys[key]=false;

        }


        button.addEventListener(
            "pointerdown",
            press
        );

        button.addEventListener(
            "pointerup",
            release
        );

        button.addEventListener(
            "pointercancel",
            release
        );

        button.addEventListener(
            "lostpointercapture",
            release
        );

    }
);


window.addEventListener(
    "pointerup",
    function(){

        resetKeys();

    }
);

function resetKeys(){

    keys.up=false;

    keys.down=false;

    keys.left=false;

    keys.right=false;

}

function saveBest(){

    if(score>bestScore){

        bestScore=score;

        try{

            localStorage.setItem(
                "fugaGalinhaBest",
                bestScore
            );

        }catch(e){}

        document
            .getElementById(
                "best"
            )
            .textContent=
            bestScore;

    }

}

===================================================== */

function gameLoop(){

    try{

        if(
            playing &&
            !paused
        ){

            moveChicken();

            updateEnemies();

            updateItems();

            updateParticles();

            updateCamera();

        }

        draw();

    }catch(error){

        console.error(error);

    }


    requestAnimationFrame(
        gameLoop
    );

}
