<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercado Maluco 3D 🛒</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

canvas{
    display:block;
}

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,#34495e55,transparent 50%),
        linear-gradient(135deg,#111,#030303);
}

.menu-box{
    width:min(520px,90%);
    padding:40px;
    text-align:center;
    background:#151515;
    border:1px solid #ffffff22;
    border-radius:25px;
    box-shadow:0 20px 80px #000b;
}

.menu-box .logo{
    font-size:70px;
}

.menu-box h1{
    font-size:42px;
    margin:10px 0;
}

.menu-box p{
    color:#bbb;
    line-height:1.6;
    margin:15px 0 25px;
}

#startBtn{
    border:0;
    background:#f59e0b;
    color:#111;
    padding:16px 35px;
    border-radius:14px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

#startBtn:hover{
    transform:scale(1.05);
    background:#fbbf24;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;
    z-index:10;
    min-width:220px;
    padding:15px;
    background:#080808dd;
    border:1px solid #ffffff22;
    border-radius:16px;
}

#hud h2{
    margin-bottom:10px;
    font-size:20px;
}

.stat{
    margin:5px 0;
}

#pedido{
    position:fixed;
    top:15px;
    right:15px;
    z-index:10;
    width:260px;
    padding:17px;
    background:#080808dd;
    border:1px solid #ffffff22;
    border-radius:16px;
}

#pedido h2{
    margin-bottom:10px;
}

#pedidoLista{
    line-height:1.8;
}

#mensagem{
    position:fixed;
    left:50%;
    bottom:80px;
    transform:translateX(-50%);
    z-index:30;
    background:#000e;
    padding:13px 22px;
    border-radius:30px;
    font-weight:bold;
    opacity:0;
    transition:.3s;
    pointer-events:none;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:10px;
    height:10px;
    transform:translate(-50%,-50%);
    border:2px solid white;
    border-radius:50%;
    z-index:8;
    pointer-events:none;
}

#fim{
    display:none;
    position:fixed;
    inset:0;
    z-index:200;
    align-items:center;
    justify-content:center;
    background:#000d;
}

.fim-box{
    width:min(450px,90%);
    padding:35px;
    text-align:center;
    background:#151515;
    border-radius:25px;
}

.fim-box h2{
    font-size:35px;
    margin-bottom:15px;
}

.restart{
    margin-top:20px;
    padding:14px 25px;
    border:0;
    border-radius:12px;
    background:#f59e0b;
    font-weight:bold;
    cursor:pointer;
}

#mobileControls{
    display:none;
    position:fixed;
    left:0;
    right:0;
    bottom:15px;
    z-index:40;
}

#joystick{
    margin-left:20px;
    width:130px;
    height:130px;
    border-radius:50%;
    background:#ffffff18;
    border:2px solid #ffffff33;
    position:relative;
}

#stick{
    position:absolute;
    width:55px;
    height:55px;
    left:37px;
    top:37px;
    border-radius:50%;
    background:#ffffff55;
}

#interagir{
    position:absolute;
    right:25px;
    bottom:20px;
    width:85px;
    height:85px;
    border:0;
    border-radius:50%;
    background:#f59e0b;
    font-weight:bold;
}

@media(max-width:700px){

    #mobileControls{
        display:block;
    }

    #pedido{
        width:190px;
        top:auto;
        bottom:15px;
        right:15px;
        font-size:12px;
    }

    #hud{
        min-width:170px;
        padding:10px;
        font-size:12px;
    }

    #hud h2{
        font-size:16px;
    }

    #crosshair{
        display:none;
    }

    .menu-box h1{
        font-size:32px;
    }
}
</style>
</head>

<body>

<!-- MENU -->

<div id="menu">

    <div class="menu-box">

        <div class="logo">🛒</div>

        <h1>Mercado Maluco</h1>

        <p>
            O supermercado mais caótico da cidade!
            Pegue os produtos, atenda os clientes
            e tente sobreviver ao caos.
        </p>

        <button id="startBtn">
            COMEÇAR 🛒
        </button>

        <p style="font-size:13px">
            PC: WASD + mouse<br>
            Celular: joystick + botão PEGAR
        </p>

    </div>

</div>


<!-- HUD -->

<div id="hud">

    <h2>🛒 Mercado Maluco</h2>

    <div class="stat">
        💰 Dinheiro:
        <b id="dinheiro">0</b>
    </div>

    <div class="stat">
        👥 Clientes:
        <b id="clientes">0</b>
    </div>

    <div class="stat">
        ⭐ Pontos:
        <b id="pontos">0</b>
    </div>

    <div class="stat">
        ⏱️ Tempo:
        <b id="tempo">120</b>s
    </div>

</div>


<!-- PEDIDO -->

<div id="pedido">

    <h2>📋 Pedido</h2>

    <div id="pedidoLista">
        Nenhum pedido.
    </div>

</div>


<div id="crosshair"></div>

<div id="mensagem"></div>


<!-- MOBILE -->

<div id="mobileControls">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="interagir">
        PEGAR
    </button>

</div>


<!-- FINAL -->

<div id="fim">

    <div class="fim-box">

        <h2>🏁 Fim de jogo!</h2>

        <p id="resultado"></p>

        <button
            class="restart"
            onclick="location.reload()"
        >
            JOGAR NOVAMENTE
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =====================================================
   VARIÁVEIS
===================================================== */

let scene;
let camera;
let renderer;
let clock;

let player;

let products = [];
let customers = [];

let keys = {};

let gameStarted = false;

let money = 0;
let points = 0;
let customersServed = 0;
let timeLeft = 120;

let yaw = 0;

let speed = 0.11;

let order = [];
let collected = [];

let joystickX = 0;
let joystickY = 0;


/* =====================================================
   PRODUTOS
===================================================== */

const productTypes = [

    {
        name:"🍎 Maçã",
        color:0xff3333
    },

    {
        name:"🍌 Banana",
        color:0xffd92f
    },

    {
        name:"🥛 Leite",
        color:0xf5f5f5
    },

    {
        name:"🍞 Pão",
        color:0xc87932
    },

    {
        name:"🥤 Refrigerante",
        color:0x355cff
    },

    {
        name:"🧀 Queijo",
        color:0xffd633
    }

];


/* =====================================================
   MATERIAL
===================================================== */

function mat(color){

    return new THREE.MeshStandardMaterial({
        color:color,
        roughness:.75
    });

}


/* =====================================================
   COMEÇAR
===================================================== */

document
.getElementById("startBtn")
.addEventListener("click",startGame);


function startGame(){

    console.log("Jogo iniciado!");

    document
    .getElementById("menu")
    .style.display="none";

    gameStarted=true;

    createScene();

    createMarket();

    createPlayer();

    createProducts();

    createCustomers();

    createOrder();

    clock=new THREE.Clock();

    showMessage("🛒 Pegue os produtos do pedido!");

    animate();

}


/* =====================================================
   CENA
===================================================== */

function createScene(){

    scene=new THREE.Scene();

    scene.background=
        new THREE.Color(0x86aebb);

    scene.fog=
        new THREE.Fog(
            0x86aebb,
            15,
            55
        );


    camera=
        new THREE.PerspectiveCamera(
            70,
            innerWidth/innerHeight,
            .1,
            100
        );


    renderer=
        new THREE.WebGLRenderer({
            antialias:true
        });


    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,2)
    );

    renderer.shadowMap.enabled=true;

    document.body.appendChild(
        renderer.domElement
    );


    const ambient=
        new THREE.HemisphereLight(
            0xffffff,
            0x555555,
            1.7
        );

    scene.add(ambient);


    const sun=
        new THREE.DirectionalLight(
            0xffffff,
            2
        );

    sun.position.set(
        5,
        12,
        8
    );

    sun.castShadow=true;

    scene.add(sun);


    window.addEventListener(
        "resize",
        resize
    );


    document.addEventListener(
        "keydown",
        e=>{
            keys[e.key.toLowerCase()]=true;

            if(
                e.key.toLowerCase()==="e"
            ){
                interact();
            }
        }
    );


    document.addEventListener(
        "keyup",
        e=>{
            keys[e.key.toLowerCase()]=false;
        }
    );


    renderer.domElement.addEventListener(
        "click",
        ()=>{
            renderer.domElement.requestPointerLock();
        }
    );


    document.addEventListener(
        "mousemove",
        e=>{

            if(
                document.pointerLockElement===
                renderer.domElement
            ){

                yaw-=e.movementX*.0025;

            }

        }
    );


    setupMobile();

}


/* =====================================================
   MERCADO
===================================================== */

function createMarket(){

    /* chão */

    const floor=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                42,
                .2,
                32
            ),
            mat(0xd9d9d9)
        );

    floor.position.y=-.1;

    floor.receiveShadow=true;

    scene.add(floor);


    /* paredes */

    createWall(
        0,3,-16,
        42,6,.4
    );

    createWall(
        0,3,16,
        42,6,.4
    );

    createWall(
        -21,3,0,
        .4,6,32
    );

    createWall(
        21,3,0,
        .4,6,32
    );


    /* prateleiras */

    for(
        let x=-15;
        x<=15;
        x+=6
    ){

        createShelf(x,-6);

        createShelf(x,2);

        createShelf(x,10);

    }


    /* caixas */

    createCheckout(16,-11);

    createSign(
        16,
        3,
        -11,
        "CAIXAS"
    );


    createSign(
        0,
        5,
        -15.7,
        "MERCADO MALUCO"
    );

}


/* =====================================================
   PAREDE
===================================================== */

function createWall(
    x,y,z,
    w,h,d
){

    const wall=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,h,d
            ),
            mat(0xf1f1f1)
        );

    wall.position.set(
        x,y,z
    );

    wall.castShadow=true;

    scene.add(wall);

}


/* =====================================================
   PRATELEIRA
===================================================== */

function createShelf(x,z){

    const group=
        new THREE.Group();


    for(
        let i=0;
        i<3;
        i++
    ){

        const shelf=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    4.8,
                    .18,
                    1.2
                ),
                mat(0x704522)
            );

        shelf.position.y=
            .5+i*1.1;

        group.add(shelf);

    }


    const side=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .18,
                3.2,
                1.2
            ),
            mat(0x704522)
        );

    side.position.set(
        -2.3,
        1.5,
        0
    );

    group.add(side);


    const side2=side.clone();

    side2.position.x=2.3;

    group.add(side2);


    group.position.set(
        x,
        0,
        z
    );


    scene.add(group);

}


/* =====================================================
   PLACA
===================================================== */

function createSign(
    x,y,z,text
){

    const canvas=
        document.createElement("canvas");

    canvas.width=512;
    canvas.height=128;

    const ctx=
        canvas.getContext("2d");

    ctx.fillStyle="#222";

    ctx.fillRect(
        0,0,
        512,128
    );

    ctx.fillStyle="#fff";

    ctx.font=
        "bold 42px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
        text,
        256,
        64
    );


    const texture=
        new THREE.CanvasTexture(
            canvas
        );


    const sign=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                5,
                1.25
            ),
            new THREE.MeshBasicMaterial({
                map:texture
            })
        );


    sign.position.set(
        x,y,z
    );


    sign.rotation.y=Math.PI;

    scene.add(sign);

}


/* =====================================================
   CAIXA
===================================================== */

function createCheckout(x,z){

    const box=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.5,
                1.2,
                1.8
            ),
            mat(0x333333)
        );

    box.position.set(
        x,.6,z
    );

    box.castShadow=true;

    scene.add(box);

}


/* =====================================================
   PLAYER
===================================================== */

function createPlayer(){

    player=
        new THREE.Group();


    const body=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .65,
                1,
                .4
            ),
            mat(0x2563eb)
        );

    body.position.y=.8;

    body.castShadow=true;


    const head=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .35,
                16,
                16
            ),
            mat(0xffc49b)
        );

    head.position.y=1.55;

    head.castShadow=true;


    player.add(
        body,
        head
    );


    player.position.set(
        0,
        0,
        12
    );


    scene.add(player);

}


/* =====================================================
   PRODUTOS
===================================================== */

function createProducts(){

    let index=0;


    for(
        let shelfX=-15;
        shelfX<=15;
        shelfX+=6
    ){

        for(
            let i=0;
            i<3;
            i++
        ){

            const type=
                productTypes[
                    index%
                    productTypes.length
                ];


            const product=
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .55,
                        .65,
                        .55
                    ),
                    mat(type.color)
                );


            product.position.set(
                shelfX-1.3+i*1.2,
                .9,
                -6
            );


            product.userData.type=
                type.name;

            product.userData.taken=false;

            product.castShadow=true;


            scene.add(product);

            products.push(product);

            index++;

        }

    }

}


/* =====================================================
   CLIENTES
===================================================== */

function createCustomers(){

    for(
        let i=0;
        i<7;
        i++
    ){

        const customer=
            new THREE.Group();


        /* CORREÇÃO DO ERRO ORIGINAL:
           agora a cor é gerada corretamente */

        const randomColor =
            Math.floor(
                Math.random()*0xffffff
            );


        const body=
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .35,
                    .4,
                    1,
                    12
                ),
                mat(randomColor)
            );


        body.position.y=.6;


        const head=
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .3,
                    12,
                    12
                ),
                mat(0xffc49b)
            );


        head.position.y=1.35;


        customer.add(
            body,
            head
        );


        customer.position.set(
            -17+Math.random()*34,
            0,
            -13+Math.random()*25
        );


        customer.userData.speed=
            .015+
            Math.random()*.02;


        customer.userData.target=
            new THREE.Vector3(
                -15+Math.random()*30,
                0,
                -10+Math.random()*20
            );


        scene.add(customer);

        customers.push(customer);

    }

}


/* =====================================================
   PEDIDO
===================================================== */

function createOrder(){

    order=[];
    collected=[];


    const amount=
        2+
        Math.floor(
            Math.random()*3
        );


    for(
        let i=0;
        i<amount;
        i++
    ){

        const type=
            productTypes[
                Math.floor(
                    Math.random()*
                    productTypes.length
                )
            ];


        order.push(
            type.name
        );

    }


    updateOrder();

}


function updateOrder(){

    const div=
        document.getElementById(
            "pedidoLista"
        );


    if(order.length===0){

        div.innerHTML=
            "🎉 Pedido completo!";

        return;

    }


    const unique=
        [...new Set(order)];


    div.innerHTML=
        unique
        .map(item=>{

            const total=
                order.filter(
                    x=>x===item
                ).length;

            const got=
                collected.filter(
                    x=>x===item
                ).length;

            return `
                ${got>=total?"✅":"⬜"}
                ${item}
                ${got}/${total}
            `;

        })
        .join("<br>");

}


/* =====================================================
   INTERAÇÃO
===================================================== */

function interact(){

    if(!gameStarted)
        return;


    let nearest=null;

    let distanceLimit=2.3;


    products.forEach(product=>{

        if(product.userData.taken)
            return;


        const distance=
            player.position.distanceTo(
                product.position
            );


        if(distance<distanceLimit){

            nearest=product;

            distanceLimit=distance;

        }

    });


    if(!nearest){

        showMessage(
            "❌ Nenhum produto perto!"
        );

        return;

    }


    const type=
        nearest.userData.type;


    const index=
        order.indexOf(type);


    if(index===-1){

        showMessage(
            "❌ Esse produto não está no pedido!"
        );

        return;

    }


    nearest.userData.taken=true;

    nearest.visible=false;


    collected.push(type);

    order.splice(
        index,
        1
    );


    points+=50;


    updateHUD();

    updateOrder();


    if(order.length===0){

        const reward=
            100+
            Math.floor(
                timeLeft
            );


        money+=reward;

        points+=200;

        customersServed++;


        showMessage(
            "🎉 Pedido entregue! +$"+
            reward
        );


        setTimeout(
            createOrder,
            800
        );

    }

}


/* =====================================================
   MOVIMENTO
===================================================== */

function updatePlayer(){

    if(!player)
        return;


    let forward=0;

    let side=0;


    if(
        keys["w"]||
        keys["arrowup"]
    )
        forward=1;


    if(
        keys["s"]||
        keys["arrowdown"]
    )
        forward=-1;


    if(
        keys["a"]||
        keys["arrowleft"]
    )
        side=-1;


    if(
        keys["d"]||
        keys["arrowright"]
    )
        side=1;


    if(
        joystickX!==0||
        joystickY!==0
    ){

        side=joystickX;

        forward=-joystickY;

    }


    if(
        forward===0&&
        side===0
    )
        return;


    const move=
        new THREE.Vector3(
            side,
            0,
            forward
        );


    move.normalize();


    const forwardVector=
        new THREE.Vector3(
            Math.sin(yaw),
            0,
            Math.cos(yaw)
        );


    const rightVector=
        new THREE.Vector3(
            Math.cos(yaw),
            0,
            -Math.sin(yaw)
        );


    const movement=
        new THREE.Vector3();


    movement.addScaledVector(
        forwardVector,
        move.z*speed
    );


    movement.addScaledVector(
        rightVector,
        move.x*speed
    );


    player.position.add(
        movement
    );


    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -19,
            19
        );


    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -14,
            14
        );

}


/* =====================================================
   CÂMERA
===================================================== */

function updateCamera(){

    if(!player)
        return;


    const distance=5;


    camera.position.set(
        player.position.x+
        Math.sin(yaw)*distance,

        player.position.y+2.8,

        player.position.z+
        Math.cos(yaw)*distance
    );


    camera.lookAt(
        player.position.x,
        player.position.y+1,
        player.position.z
    );

}


/* =====================================================
   CLIENTES
===================================================== */

function updateCustomers(){

    customers.forEach(customer=>{

        const target=
            customer.userData.target;


        if(
            customer.position.distanceTo(
                target
            )<.5
        ){

            customer.userData.target=
                new THREE.Vector3(
                    -17+Math.random()*34,
                    0,
                    -13+Math.random()*25
                );

            return;

        }


        const direction=
            new THREE.Vector3()
            .subVectors(
                target,
                customer.position
            )
            .normalize();


        customer.position.add(
            direction.multiplyScalar(
                customer.userData.speed
            )
        );

    });

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    document.getElementById(
        "dinheiro"
    ).textContent=money;


    document.getElementById(
        "clientes"
    ).textContent=customersServed;


    document.getElementById(
        "pontos"
    ).textContent=points;


    document.getElementById(
        "tempo"
    ).textContent=
        Math.ceil(
            Math.max(
                timeLeft,
                0
            )
        );

}


/* =====================================================
   MENSAGEM
===================================================== */

function showMessage(text){

    const element=
        document.getElementById(
            "mensagem"
        );


    element.textContent=text;

    element.style.opacity="1";


    clearTimeout(
        element.messageTimer
    );


    element.messageTimer=
        setTimeout(
            ()=>{
                element.style.opacity="0";
            },
            2300
        );

}


/* =====================================================
   TEMPO
===================================================== */

function updateTime(delta){

    timeLeft-=delta;


    if(timeLeft<=0){

        timeLeft=0;

        finishGame();

    }


    updateHUD();

}


/* =====================================================
   FINAL
===================================================== */

function finishGame(){

    if(!gameStarted)
        return;


    gameStarted=false;


    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }


    document.getElementById(
        "fim"
    ).style.display="flex";


    document.getElementById(
        "resultado"
    ).innerHTML=`

        👥 Clientes atendidos:
        <b>${customersServed}</b>

        <br><br>

        💰 Dinheiro:
        <b>$${money}</b>

        <br><br>

        ⭐ Pontos:
        <b>${points}</b>

    `;

}


/* =====================================================
   MOBILE
===================================================== */

function setupMobile(){

    const joystick=
        document.getElementById(
            "joystick"
        );


    const stick=
        document.getElementById(
            "stick"
        );


    let active=false;


    joystick.addEventListener(
        "touchstart",
        e=>{
            active=true;
            e.preventDefault();
        },
        {passive:false}
    );


    joystick.addEventListener(
        "touchmove",
        e=>{

            if(!active)
                return;


            const touch=
                e.touches[0];


            const rect=
                joystick.getBoundingClientRect();


            let x=
                touch.clientX-
                rect.left-
                rect.width/2;


            let y=
                touch.clientY-
                rect.top-
                rect.height/2;


            const max=38;


            const distance=
                Math.sqrt(
                    x*x+y*y
                );


            if(distance>max){

                x=
                    x/distance*max;

                y=
                    y/distance*max;

            }


            stick.style.transform=
                `translate(${x}px,${y}px)`;


            joystickX=
                x/max;

            joystickY=
                y/max;


            e.preventDefault();

        },
        {passive:false}
    );


    joystick.addEventListener(
        "touchend",
        ()=>{

            active=false;

            joystickX=0;

            joystickY=0;

            stick.style.transform=
                "translate(0,0)";

        }
    );


    document
    .getElementById("interagir")
    .addEventListener(
        "touchstart",
        e=>{
            e.preventDefault();
            interact();
        },
        {passive:false}
    );

}


/* =====================================================
   LOOP
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(!gameStarted){

        if(renderer)
            renderer.render(
                scene,
                camera
            );

        return;

    }


    const delta=
        Math.min(
            clock.getDelta(),
            .05
        );


    updatePlayer();

    updateCamera();

    updateCustomers();

    updateTime(delta);


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    if(!camera||!renderer)
        return;


    camera.aspect=
        innerWidth/
        innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        innerWidth,
        innerHeight
    );

}
