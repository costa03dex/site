```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quarto dos Sonhos ✨</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #151522;
    color: white;
    overflow: hidden;
}

header {
    height: 70px;
    background: #202033;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    border-bottom: 2px solid #343450;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.logo span {
    color: #b58cff;
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
}

#reset {
    background: #ff5d7d;
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
}

.game {
    height: calc(100vh - 70px);
    display: flex;
}

/* PAINEL */

.sidebar {
    width: 250px;
    background: #1b1b2b;
    padding: 18px;
    overflow-y: auto;
    border-right: 2px solid #343450;
}

.sidebar h2 {
    margin-top: 0;
}

.category {
    color: #aaa;
    font-size: 13px;
    margin: 20px 0 8px;
    text-transform: uppercase;
}

.item {
    background: #292941;
    padding: 13px;
    border-radius: 12px;
    margin-bottom: 9px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: grab;
    transition: .2s;
}

.item:hover {
    transform: translateX(5px);
    background: #353554;
}

.item .emoji {
    font-size: 30px;
}

.item small {
    color: #aaa;
}

/* QUARTO */

.room-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #11111b;
}

.room {
    position: absolute;
    inset: 25px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 0 40px #0008;
    background: #e8d9ff;
}

/* parede */

.wall {
    position: absolute;
    inset: 0 0 32% 0;
    background:
        linear-gradient(#d9c4f0cc, #d9c4f0cc),
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 80px,
            #ffffff22 81px,
            #ffffff22 82px
        );
}

/* janela */

.window {
    position: absolute;
    top: 45px;
    right: 80px;
    width: 180px;
    height: 125px;
    background: linear-gradient(135deg,#8ed8ff,#d7f5ff);
    border: 12px solid white;
    box-shadow: 0 5px 20px #0003;
}

.window::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 8px;
    background: white;
    transform: translateX(-50%);
}

.window::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 8px;
    background: white;
    transform: translateY(-50%);
}

/* piso */

.floor {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 32%;
    background:
        repeating-linear-gradient(
            0deg,
            #b98255 0px,
            #b98255 28px,
            #a96f45 30px
        );
}

/* objetos */

.object {
    position: absolute;
    cursor: grab;
    z-index: 10;
    transform: translate(-50%, -50%);
    transition: filter .15s;
}

.object:hover {
    filter: brightness(1.12);
}

.object.selected {
    outline: 3px dashed white;
    outline-offset: 5px;
}

.object:active {
    cursor: grabbing;
}

.object .delete {
    display: none;
    position: absolute;
    top: -15px;
    right: -15px;
    background: #ff4e6d;
    color: white;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    font-size: 15px;
}

.object.selected .delete {
    display: block;
}

/* móveis */

.bed {
    width: 240px;
    height: 145px;
    background: #f4edf9;
    border: 7px solid #6d527f;
    border-radius: 18px;
    box-shadow: 0 10px 15px #0004;
}

.bed::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 48px;
    top: 0;
    background: #b58cff;
    border-radius: 10px 10px 0 0;
}

.bed::after {
    content: "🛏️";
    position: absolute;
    font-size: 55px;
    left: 50%;
    top: 55%;
    transform: translate(-50%,-50%);
}

.desk {
    width: 180px;
    height: 85px;
    background: #8c5f43;
    border-radius: 8px;
    box-shadow: 0 10px 15px #0004;
}

.desk::before {
    content: "💻";
    position: absolute;
    font-size: 48px;
    left: 50%;
    top: -45px;
    transform: translateX(-50%);
}

.chair {
    width: 70px;
    height: 70px;
    background: #7d65aa;
    border-radius: 15px;
    box-shadow: 0 8px 10px #0004;
}

.chair::before {
    content: "🪑";
    position: absolute;
    font-size: 55px;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
}

.rug {
    width: 230px;
    height: 130px;
    border-radius: 50%;
    background: #ff9ec4;
    box-shadow: 0 8px 15px #0004;
}

.plant {
    font-size: 75px;
}

.lamp {
    font-size: 70px;
}

.picture {
    font-size: 65px;
}

.teddy {
    font-size: 70px;
}

.books {
    font-size: 65px;
}

.clock {
    font-size: 60px;
}

/* HUD */

.info {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    background: #202033ee;
    padding: 10px 18px;
    border-radius: 30px;
    z-index: 100;
    color: #ddd;
}

#score {
    color: #d5b5ff;
    font-weight: bold;
}

/* PALETA */

.palette {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.color {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid white;
    cursor: pointer;
}

.color:hover {
    transform: scale(1.1);
}

/* MOBILE */

@media(max-width:700px) {
    .sidebar {
        width: 150px;
        padding: 10px;
    }

    .logo {
        font-size: 17px;
    }

    .sidebar h2 {
        font-size: 18px;
    }

    .item {
        padding: 8px;
    }

    .item .emoji {
        font-size: 23px;
    }

    .room {
        inset: 10px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">✨ Quarto <span>dos Sonhos</span></div>
    <button id="reset">🔄 Limpar quarto</button>
</header>

<div class="game">

    <aside class="sidebar">

        <h2>🎨 Decorar</h2>

        <div class="category">Móveis</div>

        <div class="item" draggable="true" data-type="bed">
            <div class="emoji">🛏️</div>
            <div>Cama<br><small>Arraste para o quarto</small></div>
        </div>

        <div class="item" draggable="true" data-type="desk">
            <div class="emoji">🖥️</div>
            <div>Escrivaninha</div>
        </div>

        <div class="item" draggable="true" data-type="chair">
            <div class="emoji">🪑</div>
            <div>Cadeira</div>
        </div>

        <div class="item" draggable="true" data-type="rug">
            <div class="emoji">🟣</div>
            <div>Tapete</div>
        </div>

        <div class="category">Decoração</div>

        <div class="item" draggable="true" data-type="plant">
            <div class="emoji">🪴</div>
            <div>Planta</div>
        </div>

        <div class="item" draggable="true" data-type="lamp">
            <div class="emoji">💡</div>
            <div>Luminária</div>
        </div>

        <div class="item" draggable="true" data-type="picture">
            <div class="emoji">🖼️</div>
            <div>Quadro</div>
        </div>

        <div class="item" draggable="true" data-type="teddy">
            <div class="emoji">🧸</div>
            <div>Ursinho</div>
        </div>

        <div class="item" draggable="true" data-type="books">
            <div class="emoji">📚</div>
            <div>Livros</div>
        </div>

        <div class="item" draggable="true" data-type="clock">
            <div class="emoji">🕐</div>
            <div>Relógio</div>
        </div>

        <div class="category">🎨 Parede</div>

        <div class="palette">
            <div class="color" style="background:#d9c4f0" data-color="#d9c4f0"></div>
            <div class="color" style="background:#ffc8dd" data-color="#ffc8dd"></div>
            <div class="color" style="background:#cde8ff" data-color="#cde8ff"></div>
            <div class="color" style="background:#c9f7d5" data-color="#c9f7d5"></div>
            <div class="color" style="background:#fff0b5" data-color="#fff0b5"></div>
            <div class="color" style="background:#ddd" data-color="#dddddd"></div>
        </div>

    </aside>

    <main class="room-area">

        <div class="room" id="room">

            <div class="wall" id="wall"></div>

            <div class="window"></div>

            <div class="floor"></div>

        </div>

        <div class="info">
            🖱️ Arraste os móveis • Clique para selecionar •
            Pontos: <span id="score">0</span>
        </div>

    </main>

</div>

<script>

const room = document.getElementById("room");
const wall = document.getElementById("wall");
const scoreText = document.getElementById("score");

let score = 0;
let draggedType = null;
let selected = null;

/* ARRASTAR ITEM DO MENU */

document.querySelectorAll(".item").forEach(item => {

    item.addEventListener("dragstart", e => {
        draggedType = item.dataset.type;
    });

});

/* SOLTAR NO QUARTO */

room.addEventListener("dragover", e => {
    e.preventDefault();
});

room.addEventListener("drop", e => {

    e.preventDefault();

    if(!draggedType) return;

    const rect = room.getBoundingClientRect();

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    createObject(draggedType, x, y);

    draggedType = null;
});

/* CRIAR OBJETO */

function createObject(type, x, y) {

    const object = document.createElement("div");

    object.className = "object " + type;

    if(type === "plant") object.textContent = "🪴";
    if(type === "lamp") object.textContent = "💡";
    if(type === "picture") object.textContent = "🖼️";
    if(type === "teddy") object.textContent = "🧸";
    if(type === "books") object.textContent = "📚";
    if(type === "clock") object.textContent = "🕐";

    if(type === "bed" ||
       type === "desk" ||
       type === "chair" ||
       type === "rug") {

        object.innerHTML = "";
    }

    object.style.left = x + "px";
    object.style.top = y + "px";

    const deleteButton = document.createElement("button");

    deleteButton.className = "delete";
    deleteButton.textContent = "×";

    deleteButton.onclick = function(e) {

        e.stopPropagation();

        object.remove();

        score = Math.max(0, score - 5);

        updateScore();
    };

    object.appendChild(deleteButton);

    room.appendChild(object);

    makeDraggable(object);

    object.addEventListener("click", e => {

        e.stopPropagation();

        selectObject(object);
    });

    score += 10;

    updateScore();
}

/* SELECIONAR */

function selectObject(object) {

    document.querySelectorAll(".object").forEach(o => {
        o.classList.remove("selected");
    });

    object.classList.add("selected");

    selected = object;
}

/* ARRASTAR OBJETOS */

function makeDraggable(element) {

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    element.addEventListener("pointerdown", e => {

        if(e.target.classList.contains("delete")) return;

        dragging = true;

        const rect = element.getBoundingClientRect();

        offsetX = e.clientX - rect.left - rect.width / 2;
        offsetY = e.clientY - rect.top - rect.height / 2;

        element.setPointerCapture(e.pointerId);

        selectObject(element);
    });

    element.addEventListener("pointermove", e => {

        if(!dragging) return;

        const roomRect = room.getBoundingClientRect();

        let x = e.clientX - roomRect.left - offsetX;
        let y = e.clientY - roomRect.top - offsetY;

        x = Math.max(10, Math.min(room.clientWidth - 10, x));
        y = Math.max(10, Math.min(room.clientHeight - 10, y));

        element.style.left = x + "px";
        element.style.top = y + "px";
    });

    element.addEventListener("pointerup", () => {

        dragging = false;
    });
}

/* CLICAR NO FUNDO */

room.addEventListener("click", () => {

    document.querySelectorAll(".object").forEach(o => {
        o.classList.remove("selected");
    });

    selected = null;
});

/* MUDAR COR DA PAREDE */

document.querySelectorAll(".color").forEach(color => {

    color.addEventListener("click", () => {

        wall.style.background =
            `linear-gradient(${color.dataset.color}cc, ${color.dataset.color}cc),
             repeating-linear-gradient(
                90deg,
                transparent 0,
                transparent 80px,
                #ffffff22 81px,
                #ffffff22 82px
             )`;

        score += 5;

        updateScore();
    });

});

/* RESET */

document.getElementById("reset").onclick = () => {

    document.querySelectorAll(".object").forEach(o => o.remove());

    score = 0;

    updateScore();

    wall.style.background =
        `linear-gradient(#d9c4f0cc, #d9c4f0cc),
         repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 80px,
            #ffffff22 81px,
            #ffffff22 82px
         )`;
};

/* PONTOS */

function updateScore() {

    scoreText.textContent = score;
}

</script>

</body>
</html>
