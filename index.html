<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🐔 Fuga da Galinha</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#17251a;
  font-family:Arial,sans-serif;
}

body{
  touch-action:none;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
  touch-action:none;
}

.hidden{
  display:none!important;
}

/* ================= MENU ================= */

.screen{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,#527b3c 0%,#18251b 65%,#070a08 100%);
}

.menu{
  width:min(600px,92%);
  max-height:90vh;
  overflow:auto;
  padding:35px 25px;
  text-align:center;
  border:2px solid #91d85c;
  border-radius:25px;
  background:rgba(7,14,9,.96);
  box-shadow:0 0 50px rgba(120,210,70,.25);
}

.logo{
  font-size:75px;
  margin-bottom:10px;
}

h1{
  color:white;
  font-size:clamp(28px,7vw,48px);
  margin-bottom:10px;
}

.subtitle{
  color:#bcd6ac;
  margin-bottom:25px;
  font-size:18px;
  line-height:1.5;
}

button{
  display:inline-block;
  border:0;
  border-bottom:5px solid #315e1c;
  border-radius:14px;
  padding:15px 30px;
  margin:7px;
  background:linear-gradient(#7bc849,#4e8d2d);
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  touch-action:manipulation;
}

button:hover{
  filter:brightness(1.08);
}

button:active{
  transform:translateY(3px);
  border-bottom-width:2px;
}

.info{
  color:#aab9a6;
  line-height:1.6;
  margin-top:20px;
}

/* ================= HUD ================= */

#hud{
  position:fixed;
  z-index:20;
  top:12px;
  left:12px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  pointer-events:none;
}

.hud{
  padding:8px 12px;
  border-radius:12px;
  background:rgba(5,12,7,.88);
  border:1px solid #5e824d;
  color:white;
  font-weight:bold;
  box-shadow:0 3px 10px rgba(0,0,0,.2);
}

#pause{
  position:fixed;
  z-index:21;
  right:12px;
  top:12px;
  margin:0;
  padding:9px 13px;
  font-size:18px;
}

/* ================= MENSAGEM ================= */

#msg{
  position:fixed;
  z-index:25;
  top:75px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(5,10,6,.94);
  border:1px solid #91d85c;
  border-radius:12px;
  padding:10px 18px;
  color:white;
  opacity:0;
  transition:.2s;
  pointer-events:none;
  white-space:nowrap;
  box-shadow:0 4px 15px rgba(0,0,0,.25);
}

/* ================= ERRO ================= */

#errorBox{
  position:fixed;
  z-index:9999;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(700px,92%);
  padding:22px;
  border:2px solid #ff5555;
  border-radius:18px;
  background:#160606;
  color:white;
  font-family:monospace;
  text-align:left;
  box-shadow:0 0 40px rgba(255,0,0,.25);
}

#errorBox h2{
  color:#ff7777;
  margin-bottom:10px;
}

/* ================= CELULAR ================= */

#mobileControls{
  position:fixed;
  z-index:30;
  left:18px;
  bottom:18px;
  width:150px;
  height:150px;
  display:none;
}

.dpad{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:15px;
  border:2px solid #8bad79;
  background:rgba(15,30,18,.88);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  touch-action:none;
  -webkit-tap-highlight-color:transparent;
}

.dpad:active,
.action:active{
  background:rgba(70,120,60,.95);
  transform:scale(.94);
}

.up{
  left:49px;
  top:0;
}

.left{
  left:0;
  top:49px;
}

.down{
  left:49px;
  top:98px;
}

.right{
  left:98px;
  top:49px;
}

#actions{
  position:fixed;
  z-index:30;
  right:18px;
  bottom:25px;
  display:none;
  gap:10px;
}

.action{
  width:65px;
  height:65px;
  border-radius:50%;
  border:2px solid #8bad79;
  background:rgba(15,30,18,.88);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  touch-action:none;
  -webkit-tap-highlight-color:transparent;
}

@media(max-width:800px){
  #mobileControls{
    display:block;
  }

  #actions{
    display:flex;
  }

  .menu{
    padding:25px 15px;
  }

  .logo{
    font-size:58px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud">🐔 ❤️ <span id="lifeText">3</span></div>
  <div class="hud">🥚 <span id="eggText">0</span></div>
  <div class="hud">🏆 <span id="scoreText">0</span></div>
  <div class="hud">🌾 <span id="levelText">1</span>/6</div>
</div>

<button id="pause" class="hidden" onclick="togglePause()">⏸️</button>

<div id="msg"></div>

<!-- ERRO DE JAVASCRIPT -->
<div id="errorBox" class="hidden">
  <h2>🐔 O jogo encontrou um erro</h2>
  <div id="errorText"></div>
  <br>
  <button onclick="location.reload()">🔄 Recarregar</button>
</div>

<!-- MENU -->
<div id="menu" class="screen">

  <div class="menu">

    <div class="logo">🐔💨</div>

    <h1>FUGA DA GALINHA</h1>

    <div class="subtitle">
      A galinha precisa escapar da fazenda!
    </div>

    <button onclick="startGame()">
      ▶️ JOGAR
    </button>

    <button onclick="showInstructions()">
      ❓ COMO JOGAR
    </button>

    <div id="instructions" class="info hidden">
      <b>PC:</b> WASD ou setas para andar.<br>
      <b>ESPAÇO:</b> impulso 💨<br>
      <b>E:</b> fazer COCÓÓÓÓÓ 🐔<br><br>

      Pegue ovos 🥚, esconda-se nas moitas 🌿,
      fuja dos inimigos e chegue até a 🚪 saída.
    </div>

    <div class="info">
      🏆 Recorde: <span id="best">0</span>
    </div>

  </div>

</div>

<!-- FINAL -->
<div id="end" class="screen hidden">

  <div class="menu">

    <div class="logo" id="endIcon">🐔</div>

    <h1 id="endTitle">FIM</h1>

    <div class="subtitle" id="endText"></div>

    <button onclick="startGame()">
      🔄 JOGAR NOVAMENTE
    </button>

    <button onclick="goMenu()">
      🏠 MENU
    </button>

  </div>

</div>

<!-- CONTROLES MOBILE -->

<div id="mobileControls">

  <div class="dpad up" data-key="up">▲</div>
  <div class="dpad left" data-key="left">◀</div>
  <div class="dpad down" data-key="down">▼</div>
  <div class="dpad right" data-key="right">▶</div>

</div>

<div id="actions">

  <div class="action" id="dashButton">
    💨
  </div>

  <div class="action" id="noiseButton">
    🐔
  </div>

</div>

<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

"use strict";

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");

var W = 0;
var H = 0;

var playing = false;
var paused = false;

var level = 1;
var lives = 3;
var eggs = 0;
var score = 0;

var particles = [];

var camera = {
  x:0,
  y:0
};

var keys = {
  up:false,
  down:false,
  left:false,
  right:false
};

var world = {

  width:1600,
  height:950,

  obstacles:[],
  bushes:[],
  eggs:[],
  enemies:[],

  /*
    IMPORTANTE:
    agora a saída nunca começa como null.
    Isso impede o erro que quebrava o loop
    antes de iniciar o jogo.
  */
  exit:{
    x:1500,
    y:800,
    w:60,
    h:80
  }

};

var chicken = {

  x:120,
  y:200,

  r:20,

  speed:4,

  dash:0,

  invincible:0,

  hidden:false

};

var messageTimeout = null;
var noiseTimer = 0;

var bestScore = loadBest();

document.getElementById("best").textContent = bestScore;


/* =====================================================
   LOCAL STORAGE SEGURO
===================================================== */

function loadBest(){

  try{

    return Number(
      localStorage.getItem("fugaGalinhaBest")
    ) || 0;

  }catch(error){

    return 0;

  }

}

function saveBest(){

  if(score > bestScore){

    bestScore = score;

    try{

      localStorage.setItem(
        "fugaGalinhaBest",
        String(bestScore)
      );

    }catch(error){

      /* navegador não permite armazenamento */
    }

    var best = document.getElementById("best");

    if(best){
      best.textContent = bestScore;
    }

  }

}


/* =====================================================
   SISTEMA DE ERRO
===================================================== */

function showError(error){

  playing = false;
  paused = false;

  var box = document.getElementById("errorBox");
  var text = document.getElementById("errorText");

  if(!box || !text)return;

  var message =
    error && error.message
      ? error.message
      : String(error);

  text.textContent = message;

  box.classList.remove("hidden");

}

window.addEventListener("error",function(event){

  console.error(event.error || event.message);

});


/* =====================================================
   TAMANHO DO CANVAS
===================================================== */

function resize(){

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W;
  canvas.height = H;

}

window.addEventListener("resize",resize);

resize();


/* =====================================================
   INICIAR
===================================================== */

function startGame(){

  try{

    document
      .getElementById("errorBox")
      .classList.add("hidden");

    document
      .getElementById("menu")
      .classList.add("hidden");

    document
      .getElementById("end")
      .classList.add("hidden");

    document
      .getElementById("hud")
      .classList.remove("hidden");

    document
      .getElementById("pause")
      .classList.remove("hidden");

    playing = true;
    paused = false;

    level = 1;
    lives = 3;
    eggs = 0;
    score = 0;

    particles = [];

    camera.x = 0;
    camera.y = 0;

    resetKeys();

    /*
      Primeiro criamos o mundo.
      Depois mostramos a mensagem.
    */
    createLevel();

    updateHUD();

    message("🐔 CORRA!");

  }catch(error){

    console.error(error);

    showError(error);

  }

}


/* =====================================================
   MENU
===================================================== */

function goMenu(){

  playing = false;
  paused = false;

  resetKeys();

  document
    .getElementById("end")
    .classList.add("hidden");

  document
    .getElementById("hud")
    .classList.add("hidden");

  document
    .getElementById("pause")
    .classList.add("hidden");

  document
    .getElementById("menu")
    .classList.remove("hidden");

}


/* =====================================================
   INSTRUÇÕES
===================================================== */

function showInstructions(){

  document
    .getElementById("instructions")
    .classList.toggle("hidden");

}


/* =====================================================
   PAUSA
===================================================== */

function togglePause(){

  if(!playing)return;

  paused = !paused;

  document
    .getElementById("pause")
    .textContent =
      paused ? "▶️" : "⏸️";

  if(paused){

    message("⏸️ PAUSADO");

  }

}


/* =====================================================
   CRIAR FASE
===================================================== */

function createLevel(){

  world.width = 1600 + level * 50;
  world.height = 950 + level * 30;

  world.obstacles = [];
  world.bushes = [];
  world.eggs = [];
  world.enemies = [];

  chicken.x = 120;
  chicken.y = 200;

  chicken.dash = 0;
  chicken.invincible = 0;
  chicken.hidden = false;

  /*
    BORDAS
  */

  world.obstacles.push(
    {
      x:-100,
      y:-100,
      w:world.width+200,
      h:80
    },
    {
      x:-100,
      y:world.height-20,
      w:world.width+200,
      h:100
    },
    {
      x:-100,
      y:-100,
      w:80,
      h:world.height+200
    },
    {
      x:world.width-20,
      y:-100,
      w:100,
      h:world.height+200
    }
  );


  /*
    CONSTRUÇÕES
  */

  addObstacle(40,40,230,150);
  addObstacle(370,100,180,120);
  addObstacle(680,280,230,120);
  addObstacle(1030,100,220,150);
  addObstacle(280,500,220,120);
  addObstacle(700,650,220,130);
  addObstacle(1110,500,230,120);


  if(level >= 2){

    addObstacle(
      550,
      430,
      100,
      180
    );

    addObstacle(
      930,
      350,
      90,
      150
    );

  }


  if(level >= 4){

    addObstacle(
      100,
      350,
      130,
      100
    );

    addObstacle(
      1280,
      700,
      180,
      90
    );

  }


  if(level >= 6){

    addObstacle(
      600,
      160,
      90,
      100
    );

    addObstacle(
      950,
      550,
      100,
      100
    );

  }


  /*
    MOITAS
  */

  for(
    var i=0;
    i<18+level*2;
    i++
  ){

    var bush = findFreePoint();

    world.bushes.push({

      x:bush.x,
      y:bush.y,

      r:30+Math.random()*12

    });

  }


  /*
    OVOS
  */

  for(
    var j=0;
    j<7+level;
    j++
  ){

    var egg = findFreePoint();

    world.eggs.push({

      x:egg.x,
      y:egg.y,

      collected:false,

      pulse:Math.random()*10

    });

  }


  /*
    INIMIGOS
  */

  for(
    var k=0;
    k<2+level;
    k++
  ){

    var enemy = findFreePoint();

    var isDog =
      k%3 === 0 &&
      level >= 3;

    world.enemies.push({

      x:enemy.x,
      y:enemy.y,

      r:isDog ? 22 : 24,

      type:isDog
        ? "dog"
        : "farmer",

      speed:isDog
        ? 1.7
        : 1.2,

      targetX:enemy.x,
      targetY:enemy.y,

      state:"patrol",

      alert:0

    });

  }


  /*
    SAÍDA
  */

  world.exit = {

    x:world.width-120,

    y:world.height-150,

    w:60,

    h:80

  };


  message(
    "🌾 FASE " +
    level +
    " — " +
    levelName()
  );

}


/* =====================================================
   OBSTÁCULO
===================================================== */

function addObstacle(x,y,w,h){

  world.obstacles.push({

    x:x,
    y:y,
    w:w,
    h:h

  });

}


/* =====================================================
   PONTO LIVRE
===================================================== */

function findFreePoint(){

  /*
    Menos tentativas e uma saída garantida.
    Evita travamentos em mapas lotados.
  */

  for(
    var i=0;
    i<180;
    i++
  ){

    var p = {

      x:
        100 +
        Math.random() *
        (world.width-200),

      y:
        100 +
        Math.random() *
        (world.height-200)

    };

    var blocked = false;


    for(
      var j=0;
      j<world.obstacles.length;
      j++
    ){

      if(
        circleRect(
          p.x,
          p.y,
          30,
          world.obstacles[j]
        )
      ){

        blocked = true;
        break;

      }

    }


    if(
      !blocked &&
      Math.hypot(
        p.x-chicken.x,
        p.y-chicken.y
      ) > 220
    ){

      return p;

    }

  }


  /*
    Se não encontrar um ponto,
    retorna uma posição segura.
  */

  return {

    x:800,
    y:450

  };

}


/* =====================================================
   NOME DAS FASES
===================================================== */

function levelName(){

  var names = [

    "A GALINHEIRA",
    "CAMPO DE MILHO",
    "O CACHORRO",
    "TRATOR DESCONTROLADO",
    "FUGA NOTURNA",
    "A ESTRADA"

  ];

  return names[level-1] || "";

}


/* =====================================================
   COLISÃO CÍRCULO / RETÂNGULO
===================================================== */

function circleRect(cx,cy,r,o){

  var nx = Math.max(
    o.x,
    Math.min(
      cx,
      o.x+o.w
    )
  );

  var ny = Math.max(
    o.y,
    Math.min(
      cy,
      o.y+o.h
    )
  );

  var dx = cx-nx;
  var dy = cy-ny;

  return (
    dx*dx +
    dy*dy
  ) < r*r;

}


/* =====================================================
   MOVIMENTO DA GALINHA
===================================================== */

function moveChicken(){

  var dx = 0;
  var dy = 0;

  if(keys.left) dx--;
  if(keys.right) dx++;

  if(keys.up) dy--;
  if(keys.down) dy++;


  if(dx || dy){

    var length =
      Math.hypot(dx,dy);

    dx /= length;
    dy /= length;

    var speed =
      chicken.dash > 0
        ? 9
        : chicken.speed;

    moveObject(
      chicken,
      dx*speed,
      dy*speed
    );

    particle(
      chicken.x-8,
      chicken.y+15,
      "#e8ead1"
    );

  }


  if(chicken.dash > 0){
    chicken.dash--;
  }

  if(chicken.invincible > 0){
    chicken.invincible--;
  }


  /*
    Verifica se está escondida
  */

  chicken.hidden = false;

  for(
    var i=0;
    i<world.bushes.length;
    i++
  ){

    var b =
      world.bushes[i];

    if(
      Math.hypot(
        chicken.x-b.x,
        chicken.y-b.y
      ) < b.r
    ){

      chicken.hidden = true;
      break;

    }

  }

}


/* =====================================================
   MOVIMENTO COM COLISÃO
===================================================== */

function moveObject(obj,dx,dy){

  obj.x += dx;

  for(
    var i=0;
    i<world.obstacles.length;
    i++
  ){

    var o =
      world.obstacles[i];

    if(
      circleRect(
        obj.x,
        obj.y,
        obj.r,
        o
      )
    ){

      if(dx > 0){

        obj.x =
          o.x -
          obj.r;

      }

      if(dx < 0){

        obj.x =
          o.x +
          o.w +
          obj.r;

      }

    }

  }


  obj.y += dy;

  for(
    var j=0;
    j<world.obstacles.length;
    j++
  ){

    var q =
      world.obstacles[j];

    if(
      circleRect(
        obj.x,
        obj.y,
        obj.r,
        q
      )
    ){

      if(dy > 0){

        obj.y =
          q.y -
          obj.r;

      }

      if(dy < 0){

        obj.y =
          q.y +
          q.h +
          obj.r;

      }

    }

  }

}


/* =====================================================
   IMPULSO
===================================================== */

function dash(){

  if(!playing || paused)return;

  chicken.dash = 20;

  particle(
    chicken.x,
    chicken.y,
    "#fff36a",
    "burst"
  );

}


/* =====================================================
   BARULHO
===================================================== */

function chickenNoise(){

  if(
    !playing ||
    paused ||
    noiseTimer > 0
  ){

    return;

  }

  noiseTimer = 100;

  message("🐔 COCÓÓÓÓÓ!");

  for(
    var i=0;
    i<world.enemies.length;
    i++
  ){

    var e =
      world.enemies[i];

    if(
      Math.hypot(
        e.x-chicken.x,
        e.y-chicken.y
      ) < 550
    ){

      e.state = "chase";

      e.targetX =
        chicken.x;

      e.targetY =
        chicken.y;

    }

  }

  particle(
    chicken.x,
    chicken.y,
    "#fff36a",
    "burst"
  );

}


/* =====================================================
   INIMIGOS
===================================================== */

function updateEnemies(){

  if(noiseTimer > 0){
    noiseTimer--;
  }


  for(
    var i=0;
    i<world.enemies.length;
    i++
  ){

    var e =
      world.enemies[i];

    var distance =
      Math.hypot(
        e.x-chicken.x,
        e.y-chicken.y
      );


    /*
      DETECTAR
    */

    if(
      !chicken.hidden &&
      distance < 260
    ){

      e.state = "chase";

    }


    /*
      PATRULHA
    */

    if(e.state === "patrol"){

      if(
        Math.hypot(
          e.x-e.targetX,
          e.y-e.targetY
        ) < 25
      ){

        e.targetX =
          100 +
          Math.random() *
          (world.width-200);

        e.targetY =
          100 +
          Math.random() *
          (world.height-200);

      }

    }


    /*
      PERSEGUIÇÃO
    */

    if(e.state === "chase"){

      e.targetX =
        chicken.x;

      e.targetY =
        chicken.y;


      if(
        chicken.hidden ||
        distance > 500
      ){

        e.state = "patrol";

      }

    }


    var dx =
      e.targetX-e.x;

    var dy =
      e.targetY-e.y;

    var len =
      Math.hypot(dx,dy) || 1;

    dx /= len;
    dy /= len;


    moveEnemy(
      e,
      dx*e.speed,
      dy*e.speed
    );


    /*
      DANO
    */

    if(
      distance <
      e.r+chicken.r &&
      !chicken.hidden &&
      chicken.invincible <= 0
    ){

      damage();

    }

  }

}


/* =====================================================
   MOVIMENTO DO INIMIGO
===================================================== */

function moveEnemy(e,dx,dy){

  e.x += dx;

  for(
    var i=0;
    i<world.obstacles.length;
    i++
  ){

    if(
      circleRect(
        e.x,
        e.y,
        e.r,
        world.obstacles[i]
      )
    ){

      e.x -= dx;

      e.targetX =
        100 +
        Math.random() *
        (world.width-200);

      e.targetY =
        100 +
        Math.random() *
        (world.height-200);

      break;

    }

  }


  e.y += dy;

  for(
    var j=0;
    j<world.obstacles.length;
    j++
  ){

    if(
      circleRect(
        e.x,
        e.y,
        e.r,
        world.obstacles[j]
      )
    ){

      e.y -= dy;

      e.targetX =
        100 +
        Math.random() *
        (world.width-200);

      e.targetY =
        100 +
        Math.random() *
        (world.height-200);

      break;

    }

  }

}


/* =====================================================
   DANO
===================================================== */

function damage(){

  lives--;

  chicken.invincible = 100;

  chicken.x = 120;
  chicken.y = 200;

  updateHUD();

  particle(
    chicken.x,
    chicken.y,
    "#ff5555",
    "burst"
  );

  if(lives <= 0){

    gameOver();

  }else{

    message("😵 VOCÊ FOI PEGO!");

  }

}


/* =====================================================
   ITENS
===================================================== */

function updateItems(){

  /*
    OVOS
  */

  for(
    var i=0;
    i<world.eggs.length;
    i++
  ){

    var egg =
      world.eggs[i];

    egg.pulse += .08;


    if(
      !egg.collected &&
      Math.hypot(
        egg.x-chicken.x,
        egg.y-chicken.y
      ) < 35
    ){

      egg.collected = true;

      eggs++;
      score += 100;

      particle(
        egg.x,
        egg.y,
        "#fff2a0",
        "burst"
      );

      message("🥚 +100!");

      updateHUD();

    }

  }


  /*
    SAÍDA
  */

  var ex = world.exit;

  if(!ex)return;


  if(
    chicken.x > ex.x-20 &&
    chicken.x < ex.x+ex.w+20 &&
    chicken.y > ex.y-20 &&
    chicken.y < ex.y+ex.h+20
  ){

    var collected = 0;

    for(
      var j=0;
      j<world.eggs.length;
      j++
    ){

      if(
        world.eggs[j].collected
      ){

        collected++;

      }

    }


    if(
      collected >=
      Math.ceil(
        world.eggs.length*.45
      )
    ){

      nextLevel();

    }else{

      message(
        "🥚 Pegue mais ovos!"
      );

    }

  }

}

function nextLevel(){

  score += 500 * level;

  if(level < 6){

    level++;

    createLevel();

    updateHUD();

}

/* =====================================================
   PARTÍCULAS
===================================================== */

function particle(
  x,
  y,
  color,
  type
){

  var amount =
    type === "burst"
      ? 18
      : 3;


  for(
    var i=0;
    i<amount;
    i++
  ){

    particles.push({

      x:x,
      y:y,

      vx:
        (Math.random()-.5)*7,

      vy:
        (Math.random()-.5)*7,

      life:
        40 +
        Math.random()*30,

      size:
        2 +
        Math.random()*4,

      color:color

    });

  }

}


function updateParticles(){

  for(
    var i=particles.length-1;
    i>=0;
    i--
  ){

    var p =
      particles[i];

    p.x += p.vx;
    p.y += p.vy;

    p.vy += .08;

    p.life--;

    if(p.life <= 0){

      particles.splice(i,1);

    }

  }

}


/* =====================================================
   CÂMERA
===================================================== */

function updateCamera(){

  var targetX =
    chicken.x-W/2;

  var targetY =
    chicken.y-H/2;


  camera.x +=
    (targetX-camera.x)*.08;

  camera.y +=
    (targetY-camera.y)*.08;


  camera.x =
    Math.max(
      0,
      Math.min(
        camera.x,
        Math.max(
          0,
          world.width-W
        )
      )
    );


  camera.y =
    Math.max(
      0,
      Math.min(
        camera.y,
        Math.max(
          0,
          world.height-H
        )
      )
    );

}


/* =====================================================
   DESENHAR
===================================================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  ctx.save();

  ctx.translate(
    -camera.x,
    -camera.y
  );


  /*
    CHÃO
  */

  ctx.fillStyle =
    level >= 5
      ? "#263729"
      : "#4f7b3c";

  ctx.fillRect(
    0,
    0,
    world.width,
    world.height
  );


  /*
    LINHAS DO CAMPO
  */

  ctx.strokeStyle =
    "rgba(220,240,170,.12)";

  ctx.lineWidth = 2;


  for(
    var x=0;
    x<world.width;
    x+=64
  ){

    ctx.beginPath();

    ctx.moveTo(x,0);
    ctx.lineTo(
      x,
      world.height
    );

    ctx.stroke();

  }


  for(
    var y=0;
    y<world.height;
    y+=64
  ){

    ctx.beginPath();

    ctx.moveTo(0,y);
    ctx.lineTo(
      world.width,
      y
    );

    ctx.stroke();

  }


  drawObstacles();
  drawBushes();
  drawEggs();
  drawExit();
  drawEnemies();
  drawChicken();
  drawParticles();


  ctx.restore();

}


/* =====================================================
   OBSTÁCULOS
===================================================== */

function drawObstacles(){

  for(
    var i=0;
    i<world.obstacles.length;
    i++
  ){

    var o =
      world.obstacles[i];


    /*
      não desenhar bordas gigantes
    */

    if(
      o.x < 0 ||
      o.y < 0 ||
      o.x+o.w > world.width ||
      o.y+o.h > world.height
    ){

      continue;

    }


    ctx.fillStyle =
      "#704e30";

    ctx.fillRect(
      o.x,
      o.y,
      o.w,
      o.h
    );


    ctx.fillStyle =
      "#936b42";

    ctx.fillRect(
      o.x,
      o.y,
      o.w,
      10
    );


    ctx.strokeStyle =
      "rgba(0,0,0,.3)";

    ctx.strokeRect(
      o.x,
      o.y,
      o.w,
      o.h
    );


    /*
      janelas
    */

    if(
      o.w > 130 &&
      o.h > 80
    ){

      ctx.fillStyle =
        "#8cc5c7";

      ctx.fillRect(
        o.x+25,
        o.y+30,
        35,
        30
      );

      ctx.fillRect(
        o.x+o.w-60,
        o.y+30,
        35,
        30
      );

    }

  }

}


/* =====================================================
   MOITAS
===================================================== */

function drawBushes(){

  for(
    var i=0;
    i<world.bushes.length;
    i++
  ){

    var b =
      world.bushes[i];


    ctx.fillStyle =
      "#285e2d";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      b.r,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
      "#3e7c38";

    ctx.beginPath();

    ctx.arc(
      b.x-12,
      b.y-8,
      b.r*.55,
      0,
      Math.PI*2
    );

    ctx.arc(
      b.x+13,
      b.y-6,
      b.r*.5,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* =====================================================
   OVOS
===================================================== */

function drawEggs(){

  for(
    var i=0;
    i<world.eggs.length;
    i++
  ){

    var e =
      world.eggs[i];

    if(e.collected)continue;

    var bob =
      Math.sin(e.pulse)*3;


    ctx.fillStyle =
      "#fff6d5";

    ctx.beginPath();

    ctx.ellipse(
      e.x,
      e.y+bob,
      11,
      15,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* =====================================================
   SAÍDA
===================================================== */

function drawExit(){

  /*
    Proteção extra:
    mesmo que algo dê errado,
    o desenho nunca quebra o jogo.
  */

  var e = world.exit;

  if(!e)return;


  ctx.fillStyle =
    "#4d301d";

  ctx.fillRect(
    e.x,
    e.y,
    e.w,
    e.h
  );


  ctx.fillStyle =
    "#93663b";

  ctx.fillRect(
    e.x+7,
    e.y+8,
    e.w-14,
    e.h-8
  );


  ctx.fillStyle =
    "#ffe269";

  ctx.beginPath();

  ctx.arc(
    e.x+e.w-13,
    e.y+e.h/2,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle = "white";
  ctx.font = "bold 18px Arial";
  ctx.textAlign = "center";

  ctx.fillText(
    "SAÍDA",
    e.x+e.w/2,
    e.y-10
  );

}

    */

/* =====================================================
   GALINHA
===================================================== */

function drawChicken(){

  ctx.save();

  ctx.translate(
    chicken.x,
    chicken.y
  );


  /*
    INVENCIBILIDADE
  */

  if(
    chicken.invincible > 0 &&
    chicken.invincible % 10 < 5
  ){

    ctx.globalAlpha = .4;

  }


  /*
    SOMBRA
  */

  ctx.fillStyle =
    "rgba(0,0,0,.25)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    23,
    25,
    8,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    CORPO
  */

  ctx.fillStyle =
    "#f4f0d8";

  ctx.beginPath();

  ctx.ellipse(
    0,
    3,
    25,
    22,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    ASA
  */

  ctx.fillStyle =
    "#ddd9bf";

  ctx.beginPath();

  ctx.ellipse(
    -8,
    7,
    12,
    8,
    -.4,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    CABEÇA
  */

  ctx.fillStyle =
    "#fff9e7";

  ctx.beginPath();

  ctx.arc(
    8,
    -18,
    17,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    CRISTA
  */

  ctx.fillStyle =
    "#e84444";

  ctx.beginPath();

  ctx.arc(
    2,
    -34,
    6,
    0,
    Math.PI*2
  );

  ctx.arc(
    10,
    -36,
    6,
    0,
    Math.PI*2
  );

  ctx.arc(
    18,
    -33,
    6,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    BICO
  */

  ctx.fillStyle =
    "#f1a332";

  ctx.beginPath();

  ctx.moveTo(23,-18);
  ctx.lineTo(38,-12);
  ctx.lineTo(23,-7);

  ctx.closePath();

  ctx.fill();


  /*
    OLHO
  */

  ctx.fillStyle =
    "#111";

  ctx.beginPath();

  ctx.arc(
    14,
    -22,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    PERNAS
  */

  ctx.strokeStyle =
    "#df9f3b";

  ctx.lineWidth = 4;

  ctx.beginPath();

  ctx.moveTo(-7,21);
  ctx.lineTo(-9,32);

  ctx.moveTo(8,21);
  ctx.lineTo(10,32);

  ctx.stroke();


  /*
    IMPULSO
  */

  if(chicken.dash > 0){

    ctx.strokeStyle =
      "#fff36a";

    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.moveTo(-25,0);
    ctx.lineTo(-50,0);

    ctx.moveTo(-23,10);
    ctx.lineTo(-43,17);

    ctx.stroke();

  }


  /*
    ESCONDIDA
  */

  if(chicken.hidden){

    ctx.fillStyle =
      "rgba(40,100,45,.28)";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      34,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  ctx.restore();

}


/* =====================================================
   PARTÍCULAS
===================================================== */

function drawParticles(){

  for(
    var i=0;
    i<particles.length;
    i++
  ){

    var p =
      particles[i];

    ctx.globalAlpha =
      Math.max(
        0,
        p.life/70
      );

    ctx.fillStyle =
      p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.globalAlpha = 1;

}


/* =====================================================
   RESETAR CONTROLES
===================================================== */

function resetKeys(){

  keys.up = false;
  keys.down = false;
  keys.left = false;
  keys.right = false;

}


/* =====================================================
   LOOP PRINCIPAL
===================================================== */

function gameLoop(){

  try{

    if(
      playing &&
      !paused
    ){

      moveChicken();

      updateEnemies();

      updateItems();

      updateParticles();

      updateCamera();

    }

    draw();

  }catch(error){

    /*
      O loop não morre silenciosamente.
      Mostra o erro na tela.
    */

    console.error(error);

    showError(error);

  }

  /*
    CONTINUA O LOOP MESMO SE ALGUMA COISA DER ERRADO.
  */

  requestAnimationFrame(gameLoop);

}


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
  "keydown",
  function(e){

    var key =
      e.key.toLowerCase();


    if(
      key === "w" ||
      e.key === "ArrowUp"
    ){

      keys.up = true;

      e.preventDefault();

    }


    if(
      key === "s" ||
      e.key === "ArrowDown"
    ){

      keys.down = true;

      e.preventDefault();

    }


    if(
      key === "a" ||
      e.key === "ArrowLeft"
    ){

      keys.left = true;

      e.preventDefault();

    }


    if(
      key === "d" ||
      e.key === "ArrowRight"
    ){

      keys.right = true;

      e.preventDefault();

    }


    if(e.code === "Space"){

      e.preventDefault();

      dash();

    }


    if(key === "e"){

      chickenNoise();

    }


    if(e.key === "Escape"){

      togglePause();

    }

  }
);


document.addEventListener(
  "keyup",
  function(e){

    var key =
      e.key.toLowerCase();


    if(
      key === "w" ||
      e.key === "ArrowUp"
    ){

      keys.up = false;

    }


    if(
      key === "s" ||
      e.key === "ArrowDown"
    ){

      keys.down = false;

    }


    if(
      key === "a" ||
      e.key === "ArrowLeft"
    ){

      keys.left = false;

    }


    if(
      key === "d" ||
      e.key === "ArrowRight"
    ){

      keys.right = false;

    }

  }
);


/*
  Se a janela perder foco,
  solta todas as teclas.
*/

window.addEventListener(
  "blur",
  resetKeys
);


/* =====================================================
   CONTROLES MOBILE
===================================================== */

var touchButtons =
  document.querySelectorAll(
    ".dpad"
  );


touchButtons.forEach(
  function(button){

    var key =
      button.dataset.key;


    function press(e){

      e.preventDefault();

      keys[key] = true;

      try{

        button.setPointerCapture(
          e.pointerId
        );

      }catch(error){}

    }


    function release(e){

      e.preventDefault();

      keys[key] = false;

    }


    button.addEventListener(
      "pointerdown",
      press
    );

    button.addEventListener(
      "pointerup",
      release
    );

    button.addEventListener(
      "pointercancel",
      release
    );

    button.addEventListener(
      "lostpointercapture",
      release
    );

  }
);


/*
  Solta o controle mesmo
  se o dedo sair do botão.
*/

window.addEventListener(
  "pointerup",
  function(){

    keys.up = false;
    keys.down = false;
    keys.left = false;
    keys.right = false;

  }
);
