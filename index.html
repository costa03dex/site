<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Room 3D ✨</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#30384c 0%,#111522 45%,#070a10 100%);
    min-height:100vh;
    color:white;
    overflow-x:hidden;
}

/* =========================
   TELA DE ESCOLHA
========================= */

#selection{
    min-height:100vh;
    padding:45px 25px;
    text-align:center;
}

#selection h1{
    font-size:clamp(35px,6vw,65px);
    margin-bottom:10px;
    text-shadow:0 8px 25px #000;
}

.subtitle{
    color:#c8cdd8;
    font-size:18px;
    margin-bottom:35px;
}

.rooms{
    max-width:1250px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:22px;
}

.room-card{
    height:300px;
    border-radius:25px;
    overflow:hidden;
    position:relative;
    cursor:pointer;
    border:2px solid rgba(255,255,255,.12);
    box-shadow:
        0 20px 40px rgba(0,0,0,.45),
        inset 0 0 30px rgba(255,255,255,.05);
    transition:.35s;
}

.room-card:hover{
    transform:translateY(-12px) scale(1.025);
    border-color:white;
    box-shadow:
        0 30px 60px rgba(0,0,0,.65),
        0 0 35px rgba(255,255,255,.12);
}

.preview-room{
    position:absolute;
    inset:0;
    overflow:hidden;
}

/* mini quarto */

.preview-wall{
    position:absolute;
    inset:0 0 32% 0;
    background:linear-gradient(145deg,#f0e7dc,#c9b9aa);
}

.preview-floor{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:34%;
    background:
        repeating-linear-gradient(
            90deg,
            #795a42 0px,
            #795a42 55px,
            #684a36 57px,
            #8b674b 60px
        );
    transform:perspective(250px) rotateX(12deg);
    transform-origin:bottom;
}

.preview-bed{
    position:absolute;
    width:125px;
    height:60px;
    left:25px;
    bottom:65px;
    background:#f4f4f4;
    border-radius:8px;
    box-shadow:10px 12px 0 #b7b7b7,0 15px 20px #0007;
}

.preview-bed:before{
    content:"";
    position:absolute;
    width:115px;
    height:25px;
    left:5px;
    top:-18px;
    background:#eee;
    border-radius:8px;
    box-shadow:0 5px 0 #aaa;
}

.preview-window{
    position:absolute;
    width:90px;
    height:75px;
    right:25px;
    top:35px;
    background:linear-gradient(135deg,#8edcff,#2d6caa);
    border:7px solid #eee;
    box-shadow:0 10px 25px #0006;
}

.preview-lamp{
    position:absolute;
    right:42px;
    bottom:75px;
    width:30px;
    height:65px;
    background:#333;
}

.preview-lamp:before{
    content:"";
    position:absolute;
    width:60px;
    height:35px;
    left:-15px;
    top:-18px;
    border-radius:50%;
    background:#ffeab0;
    box-shadow:0 0 30px #ffeab0;
}

.room-card .info{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    padding:18px;
    text-align:left;
    background:linear-gradient(transparent,#000e);
    z-index:5;
}

.room-card h2{
    font-size:25px;
}

.room-card p{
    color:#ddd;
    margin-top:5px;
}

/* cores dos quartos */

.cute .preview-wall{
    background:linear-gradient(145deg,#ffddeb,#e9aeca);
}

.gamer .preview-wall{
    background:linear-gradient(145deg,#202438,#080910);
}

.gamer .preview-floor{
    background:
        repeating-linear-gradient(
            90deg,
            #15151b 0,
            #15151b 45px,
            #252530 47px,
            #111118 50px
        );
}

.nature .preview-wall{
    background:linear-gradient(145deg,#d6ead0,#9fbd98);
}

/* =========================
   JOGO
========================= */

#game{
    display:none;
    min-height:100vh;
    padding:15px;
}

.topbar{
    max-width:1500px;
    margin:auto;
    min-height:65px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:12px;
}

.topbar h2{
    font-size:25px;
    text-shadow:0 3px 10px #000;
}

.buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

button{
    border:none;
    color:white;
    background:linear-gradient(145deg,#303847,#171c25);
    padding:11px 16px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    box-shadow:
        0 5px 12px #0007,
        inset 0 1px 0 #ffffff22;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    background:linear-gradient(145deg,#465166,#202733);
}

button:active{
    transform:translateY(2px);
}

/* =========================
   QUARTO 3D
========================= */

.room{
    width:min(1450px,100%);
    height:min(780px,78vh);
    min-height:560px;
    margin:auto;
    position:relative;
    overflow:hidden;
    perspective:1200px;
    border-radius:18px;
    box-shadow:
        0 35px 80px #000b,
        inset 0 0 60px #0006;
    background:#d8ccc0;
}

/* parede */

.wall{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:67%;
    background:
        linear-gradient(90deg,#0001,#fff2 48%,#0002),
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 70px,
            #00000008 71px
        );
    box-shadow:inset 0 -30px 50px #0002;
}

/* piso 3D */

.floor{
    position:absolute;
    left:-5%;
    right:-5%;
    bottom:-5%;
    height:40%;
    background:
        repeating-linear-gradient(
            90deg,
            #9b7658 0px,
            #9b7658 75px,
            #805e46 77px,
            #b08765 80px
        );
    transform:
        perspective(500px)
        rotateX(45deg)
        scale(1.12);
    transform-origin:bottom;
    box-shadow:inset 0 30px 50px #0003;
}

/* linhas do piso */

.floor:after{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 38px,
            #0002 40px
        );
}

/* teto */

.ceiling{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:25px;
    background:#eee;
    box-shadow:0 5px 15px #0004;
    z-index:10;
}

/* =========================
   JANELA
========================= */

.window{
    position:absolute;
    right:11%;
    top:10%;
    width:190px;
    height:145px;
    background:
        linear-gradient(135deg,#b9edff,#3976a4);
    border:12px solid #f2eee7;
    box-shadow:
        0 12px 30px #0008,
        inset 0 0 20px #0005;
    z-index:15;
}

.window:before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:6px;
    background:#eee;
    transform:translateX(-50%);
}

.window:after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:50%;
    height:6px;
    background:#eee;
    transform:translateY(-50%);
}

/* =========================
   CORTINA
========================= */

.curtain{
    position:absolute;
    top:7%;
    right:9%;
    width:225px;
    height:180px;
    z-index:16;
    pointer-events:none;
}

.curtain:before,
.curtain:after{
    content:"";
    position:absolute;
    top:0;
    width:55px;
    height:180px;
    background:
        repeating-linear-gradient(
            90deg,
            #ffffffaa 0,
            #ffffffaa 9px,
            #ddd8 12px
        );
    box-shadow:0 12px 25px #0003;
}

.curtain:before{
    left:0;
    border-radius:0 0 35px 20px;
}

.curtain:after{
    right:0;
    border-radius:0 0 20px 35px;
}

/* =========================
   PORTA
========================= */

.door{
    position:absolute;
    left:5%;
    bottom:28%;
    width:125px;
    height:255px;
    background:
        linear-gradient(90deg,#493020,#704d34 50%,#3d281c);
    border:9px solid #271a13;
    border-bottom:13px solid #25170f;
    border-radius:5px 5px 0 0;
    box-shadow:
        15px 20px 25px #0008,
        inset 0 0 20px #0007;
    z-index:18;
}

.door .panel{
    position:absolute;
    left:17px;
    right:17px;
    height:82px;
    border:4px solid #2e1c12;
    background:linear-gradient(145deg,#765137,#4b3020);
}

.door .panel.one{
    top:18px;
}

.door .panel.two{
    bottom:18px;
}

.handle{
    position:absolute;
    right:12px;
    top:50%;
    width:13px;
    height:13px;
    background:#d8b66c;
    border-radius:50%;
    box-shadow:0 2px 5px #000;
}

/* =========================
   OBJETOS
========================= */

.objects{
    position:absolute;
    inset:0;
    z-index:30;
}

/* objeto geral */

.object{
    position:absolute;
    cursor:grab;
    transform-style:preserve-3d;
    filter:drop-shadow(10px 15px 12px #0006);
    transition:filter .2s;
}

.object:hover{
    filter:
        drop-shadow(12px 18px 14px #0008)
        brightness(1.08);
    z-index:1000!important;
}

.object:active{
    cursor:grabbing;
}

/* apagar */

.delete{
    position:absolute;
    top:-12px;
    right:-12px;
    width:25px;
    height:25px;
    padding:0;
    border-radius:50%;
    background:#d83c3c;
    font-size:12px;
    z-index:100;
}

/* =========================
   CAMA
========================= */

.bed{
    width:300px;
    height:145px;
    background:linear-gradient(145deg,#fafafa,#cfcfcf);
    border-radius:12px 12px 5px 5px;
    border:5px solid #ddd;
    box-shadow:
        15px 18px 0 #9e9e9e,
        0 25px 30px #0006;
}

.bed:before{
    content:"";
    position:absolute;
    left:20px;
    top:-42px;
    width:250px;
    height:58px;
    border-radius:13px;
    background:
        linear-gradient(145deg,#fff,#d8d8d8);
    box-shadow:
        8px 8px 0 #aaa,
        inset 0 -10px 15px #0001;
}

.bed:after{
    content:"";
    position:absolute;
    left:20px;
    right:20px;
    top:20px;
    height:70px;
    border-radius:8px;
    background:
        linear-gradient(
            145deg,
            #eef2f5,
            #c7d0d8
        );
    box-shadow:inset 0 8px 12px #fff8;
}

/* cama gamer */

.gamerBed{
    width:300px;
    height:145px;
    background:linear-gradient(145deg,#171923,#343849);
    border-radius:10px;
    border:3px solid #5d6274;
    box-shadow:
        15px 18px 0 #11131b,
        0 0 25px #636dff55;
}

.gamerBed:before{
    content:"";
    position:absolute;
    left:20px;
    top:-40px;
    width:250px;
    height:55px;
    background:#202331;
    border:3px solid #555b70;
    border-radius:12px;
}

/* =========================
   SOFÁ
========================= */

.sofa{
    width:270px;
    height:110px;
    background:linear-gradient(145deg,#bcb2aa,#726b67);
    border-radius:20px 20px 8px 8px;
    box-shadow:
        15px 17px 0 #504b48,
        0 20px 30px #0006;
}

.sofa:before{
    content:"";
    position:absolute;
    left:12px;
    right:12px;
    top:-45px;
    height:70px;
    background:linear-gradient(145deg,#cfc6c0,#8e8782);
    border-radius:20px;
    box-shadow:8px 8px 0 #625c58;
}

.sofa:after{
    content:"";
    position:absolute;
    left:20px;
    right:20px;
    bottom:15px;
    height:25px;
    background:#aaa09a;
    border-radius:15px;
}

/* =========================
   MESA
========================= */

.table{
    width:190px;
    height:95px;
    background:
        linear-gradient(145deg,#9b6b43,#58351f);
    border-radius:10px;
    box-shadow:
        12px 14px 0 #392214,
        0 18px 25px #0006;
}

.table:before{
    content:"";
    position:absolute;
    width:20px;
    height:110px;
    left:18px;
    top:70px;
    background:#4b2d1c;
    box-shadow:
        130px 0 #4b2d1c;
}

/* =========================
   CADEIRA
========================= */

.chair{
    width:85px;
    height:100px;
    background:linear-gradient(145deg,#81583b,#452918);
    border-radius:12px;
    box-shadow:
        9px 12px 0 #2d1b10,
        0 15px 20px #0005;
}

.chair:before{
    content:"";
    position:absolute;
    left:5px;
    top:-70px;
    width:75px;
    height:80px;
    border-radius:12px 12px 5px 5px;
    background:linear-gradient(145deg,#916648,#4d2e1d);
    box-shadow:7px 7px 0 #392315;
}

/* =========================
   ARMÁRIO
========================= */

.dresser{
    width:145px;
    height:180px;
    background:linear-gradient(145deg,#ddd,#888);
    border:5px solid #555;
    border-radius:8px;
    box-shadow:
        14px 18px 0 #555,
        0 25px 30px #0007;
}

.dresser:before{
    content:"";
    position:absolute;
    inset:15px;
    background:
        repeating-linear-gradient(
            0deg,
            #c9c9c9 0,
            #c9c9c9 43px,
            #888 45px
        );
    border:3px solid #666;
}

/* =========================
   TV
========================= */

.tv{
    width:230px;
    height:135px;
    background:#111;
    border:9px solid #222;
    border-radius:8px;
    box-shadow:
        12px 15px 0 #050505,
        0 15px 25px #0009;
}

.tv:before{
    content:"";
    position:absolute;
    inset:10px;
    background:
        radial-gradient(circle at 50% 50%,#667 0,#18233b 45%,#070910 100%);
    border-radius:3px;
}

.tv:after{
    content:"";
    position:absolute;
    bottom:-27px;
    left:85px;
    width:55px;
    height:25px;
    background:#191919;
    clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);
}

/* =========================
   ESTANTE
========================= */

.shelf{
    width:170px;
    height:220px;
    background:#65452d;
    border:7px solid #382315;
    box-shadow:
        12px 16px 0 #2e1b10,
        0 25px 30px #0006;
}

.shelf:before{
    content:"";
    position:absolute;
    left:10px;
    right:10px;
    top:55px;
    height:8px;
    background:#392316;
    box-shadow:
        0 55px #392316,
        0 110px #392316;
}

/* =========================
   ESPELHO
========================= */

.mirror{
    width:120px;
    height:190px;
    border:12px solid #79573e;
    border-radius:55% 55% 8px 8px;
    background:
        linear-gradient(135deg,#d9f5ff,#7192a0 45%,#e9fbff);
    box-shadow:
        12px 15px 0 #4b3424,
        inset 0 0 20px #fff8,
        0 20px 30px #0007;
}

/* =========================
   TAPETE
========================= */

.rug{
    width:330px;
    height:170px;
    border-radius:50%;
    background:
        radial-gradient(
            ellipse,
            #ddd 0,
            #aaa 60%,
            #777 100%
        );
    box-shadow:
        inset 0 0 20px #0003,
        0 15px 20px #0005;
    z-index:5;
}

/* =========================
   PLANTA
========================= */

.plant{
    width:100px;
    height:170px;
}

.plant:before{
    content:"";
    position:absolute;
    bottom:0;
    left:18px;
    width:65px;
    height:60px;
    background:linear-gradient(145deg,#c8844c,#704026);
    border-radius:8px 8px 20px 20px;
    box-shadow:8px 10px 0 #512d19;
}

.plant:after{
    content:"🌿";
    position:absolute;
    font-size:90px;
    left:0;
    top:-45px;
    filter:drop-shadow(5px 8px 4px #0005);
}

/* =========================
   LUMINÁRIA
========================= */

.lamp{
    width:55px;
    height:150px;
}

.lamp:before{
    content:"";
    position:absolute;
    bottom:0;
    left:23px;
    width:9px;
    height:115px;
    background:#333;
    box-shadow:3px 0 #111;
}

.lamp:after{
    content:"";
    position:absolute;
    top:0;
    left:-5px;
    width:65px;
    height:45px;
    border-radius:50% 50% 10px 10px;
    background:linear-gradient(145deg,#fff2b5,#d5a94d);
    box-shadow:
        0 0 30px #ffe89b,
        0 0 60px #ffe89b66;
}

/* =========================
   QUARTO GAMER
========================= */

.gamerTable{
    width:260px;
    height:85px;
    background:linear-gradient(145deg,#181b27,#34394b);
    border:3px solid #62677b;
    border-radius:7px;
    box-shadow:
        12px 15px 0 #0c0e15,
        0 0 25px #5766ff44;
}

.gamerTable:before{
    content:"";
    position:absolute;
    width:18px;
    height:90px;
    left:20px;
    top:65px;
    background:#191b26;
    box-shadow:200px 0 #191b26;
}

.console{
    font-size:75px;
    width:100px;
    height:100px;
    filter:drop-shadow(8px 12px 8px #0008);
}

.led{
    width:230px;
    height:12px;
    border-radius:20px;
    background:linear-gradient(90deg,#7c4dff,#00d9ff,#ff3ca6);
    box-shadow:
        0 0 20px #7c4dff,
        0 0 40px #00d9ff55;
}

/* =========================
   QUARTO FOFO
========================= */

.vanity{
    width:190px;
    height:85px;
    background:linear-gradient(145deg,#fff,#d7aebd);
    border-radius:10px;
    box-shadow:
        12px 15px 0 #9f7181,
        0 18px 25px #0005;
}

.vanity:before{
    content:"";
    position:absolute;
    left:45px;
    top:-105px;
    width:100px;
    height:95px;
    border:8px solid #e4b8c8;
    border-radius:50%;
    background:linear-gradient(135deg,#eafaff,#8eb8c5);
    box-shadow:6px 7px 0 #a36d7e;
}

/* =========================
   LIVROS
========================= */

.books{
    font-size:55px;
    width:80px;
    height:70px;
}

/* =========================
   GUITARRA
========================= */

.guitar{
    font-size:100px;
    width:110px;
    height:170px;
    filter:drop-shadow(8px 12px 7px #0007);
}

/* =========================
   MODO ESCURO GAMER
========================= */

.gamerRoom .wall{
    background:
        radial-gradient(circle at 75% 30%,#32375a,#121522 55%,#090b10);
}

.gamerRoom .floor{
    background:
        repeating-linear-gradient(
            90deg,
            #15151c 0,
            #15151c 70px,
            #242431 72px,
            #101017 75px
        );
}

/* =========================
   HUD
========================= */

.tip{
    position:absolute;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    padding:9px 16px;
    border-radius:20px;
    background:#0009;
    color:#ddd;
    font-size:13px;
    z-index:5000;
    pointer-events:none;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:1000px){
    .rooms{
        grid-template-columns:repeat(2,1fr);
    }

    .room{
        height:72vh;
        min-height:500px;
    }

    .window{
        right:18%;
    }
}

@media(max-width:650px){
    #selection{
        padding:30px 15px;
    }

    .rooms{
        grid-template-columns:1fr;
    }

    .room-card{
        height:250px;
    }

    .room{
        height:70vh;
        min-height:470px;
    }

    .window{
        width:120px;
        height:95px;
        right:15%;
    }

    .door{
        transform:scale(.75);
        transform-origin:bottom left;
    }

    .tip{
        width:90%;
        text-align:center;
    }
}
</style>
</head>

<body>

<!-- =========================
     ESCOLHA DO QUARTO
========================= -->

<section id="selection">

    <h1>🏠 Dream Room 3D</h1>

    <p class="subtitle">
        Escolha o quarto que você quer decorar
    </p>

    <div class="rooms">

        <div class="room-card modern"
             onclick="startGame('modern')">

            <div class="preview-room">
                <div class="preview-wall"></div>
                <div class="preview-floor"></div>
                <div class="preview-bed"></div>
                <div class="preview-window"></div>
                <div class="preview-lamp"></div>
            </div>

            <div class="info">
                <h2>🏡 Moderno</h2>
                <p>Elegante e sofisticado</p>
            </div>

        </div>


        <div class="room-card cute"
             onclick="startGame('cute')">

            <div class="preview-room">
                <div class="preview-wall"></div>
                <div class="preview-floor"></div>
                <div class="preview-bed"></div>
                <div class="preview-window"></div>
                <div class="preview-lamp"></div>
            </div>

            <div class="info">
                <h2>🎀 Fofo</h2>
                <p>Rosa, delicado e aconchegante</p>
            </div>

        </div>


        <div class="room-card gamer"
             onclick="startGame('gamer')">

            <div class="preview-room">
                <div class="preview-wall"></div>
                <div class="preview-floor"></div>
                <div class="preview-bed"></div>
                <div class="preview-window"></div>
                <div class="preview-lamp"></div>
            </div>

            <div class="info">
                <h2>🎮 Gamer</h2>
                <p>Setup com iluminação RGB</p>
            </div>

        </div>


        <div class="room-card nature"
             onclick="startGame('nature')">

            <div class="preview-room">
                <div class="preview-wall"></div>
                <div class="preview-floor"></div>
                <div class="preview-bed"></div>
                <div class="preview-window"></div>
                <div class="preview-lamp"></div>
            </div>

            <div class="info">
                <h2>🌿 Natureza</h2>
                <p>Calmo, verde e aconchegante</p>
            </div>

        </div>

    </div>

</section>


<!-- =========================
     JOGO
========================= -->

<section id="game">

    <div class="topbar">

        <h2 id="roomTitle">
            🏠 Meu quarto
        </h2>

        <div class="buttons">

            <button onclick="saveRoom()">
                💾 Salvar
            </button>

            <button onclick="loadRoom()">
                🔄 Carregar
            </button>

            <button onclick="clearRoom()">
                🗑️ Limpar
            </button>

            <button onclick="backToRooms()">
                🚪 Trocar quarto
            </button>

        </div>

    </div>


    <div class="room" id="room">

        <div class="ceiling"></div>

        <div class="wall"></div>

        <div class="window"></div>

        <div class="curtain"></div>

        <div class="door">

            <div class="panel one"></div>
            <div class="panel two"></div>

            <div class="handle"></div>

        </div>

        <div class="floor"></div>

        <div class="objects" id="objects"></div>

        <div class="tip">
            🖱️ Arraste os móveis para decorar seu quarto
        </div>

    </div>

</section>


<script>

/* =====================================================
   CONFIGURAÇÃO DOS QUARTOS
===================================================== */

const rooms = {

    modern:{
        name:"🏡 Quarto Moderno",

        wall:"#ddd1c7",

        furniture:[
            "bed",
            "sofa",
            "table",
            "chair",
            "dresser",
            "shelf",
            "mirror",
            "rug",
            "tv"
        ],

        decor:[
            "plant",
            "lamp",
            "books"
        ]
    },

    cute:{
        name:"🎀 Quarto Fofo",

        wall:"#f4c7d8",

        furniture:[
            "bed",
            "vanity",
            "dresser",
            "chair",
            "rug",
            "mirror"
        ],

        decor:[
            "plant",
            "lamp",
            "books",
            "teddy",
            "flower"
        ]
    },

    gamer:{
        name:"🎮 Quarto Gamer",

        wall:"#181b29",

        furniture:[
            "gamerBed",
            "gamerTable",
            "chair",
            "dresser",
            "shelf",
            "tv"
        ],

        decor:[
            "console",
            "led",
            "books",
            "plant"
        ]
    },

    nature:{
        name:"🌿 Quarto Natureza",

        wall:"#c8d8c1",

        furniture:[
            "bed",
            "table",
            "chair",
            "shelf",
            "dresser",
            "rug"
        ],

        decor:[
            "plant",
            "flower",
            "guitar",
            "books",
            "lamp"
        ]
    }

};


/* =====================================================
   ESTADO
===================================================== */

let currentRoom = null;

let selectedObject = null;

let offsetX = 0;
let offsetY = 0;

let zIndex = 100;


/* =====================================================
   INICIAR JOGO
===================================================== */

function startGame(type){

    currentRoom = type;

    document.getElementById("selection").style.display="none";

    document.getElementById("game").style.display="block";

    document.getElementById("roomTitle").textContent =
        rooms[type].name;

    const room =
        document.getElementById("room");

    room.className="room";

    if(type==="gamer"){
        room.classList.add("gamerRoom");
    }

    room.querySelector(".wall").style.background =
        getWall(type);

    loadRoom();

}


/* =====================================================
   COR DA PAREDE
===================================================== */

function getWall(type){

    if(type==="cute")
        return `
        linear-gradient(90deg,#f4c1d2,#ffe6ee,#dda5bc)
        `;

    if(type==="gamer")
        return `
        radial-gradient(circle at 75% 30%,#343a60,#111522 55%,#080a10)
        `;

    if(type==="nature")
        return `
        linear-gradient(145deg,#d8e8d2,#a9c39f)
        `;

    return `
        linear-gradient(145deg,#eee5dc,#c9bbb0)
        `;
}


/* =====================================================
   CRIAR OBJETO
===================================================== */

function createObject(type,x,y){

    const obj=document.createElement("div");

    obj.className="object "+type;

    obj.dataset.type=type;

    obj.style.left=x+"px";

    obj.style.top=y+"px";

    obj.style.zIndex=++zIndex;


    /* objetos emoji */

    if(type==="teddy"){
        obj.textContent="🧸";
        obj.style.fontSize="75px";
    }

    else if(type==="flower"){
        obj.textContent="🌸";
        obj.style.fontSize="65px";
    }

    else if(type==="books"){
        obj.textContent="📚";
    }

    else if(type==="guitar"){
        obj.textContent="🎸";
    }

    else if(type==="console"){
        obj.textContent="🎮";
    }


    /* botão apagar */

    const del=document.createElement("button");

    del.className="delete";

    del.textContent="×";

    del.onclick=function(e){

        e.stopPropagation();

        obj.remove();

    };

    obj.appendChild(del);


    /* arrastar */

    obj.addEventListener("pointerdown",startDrag);

    document.getElementById("objects").appendChild(obj);

    return obj;
}


/* =====================================================
   ARRASTAR
===================================================== */

function startDrag(e){

    if(e.target.classList.contains("delete"))
        return;

    selectedObject=this;

    selectedObject.style.zIndex=++zIndex;

    const rect=
        selectedObject.getBoundingClientRect();

    offsetX=e.clientX-rect.left;

    offsetY=e.clientY-rect.top;

    selectedObject.setPointerCapture(e.pointerId);

    selectedObject.addEventListener(
        "pointermove",
        dragObject
    );

    selectedObject.addEventListener(
        "pointerup",
        stopDrag
    );

    selectedObject.addEventListener(
        "pointercancel",
        stopDrag
    );
}


function dragObject(e){

    if(!selectedObject)
        return;

    const room=
        document.getElementById("room");

    const rect=
        room.getBoundingClientRect();

    let x=
        e.clientX-rect.left-offsetX;

    let y=
        e.clientY-rect.top-offsetY;


    const maxX=
        room.clientWidth-
        selectedObject.offsetWidth;

    const maxY=
        room.clientHeight-
        selectedObject.offsetHeight;


    x=Math.max(0,Math.min(x,maxX));

    y=Math.max(0,Math.min(y,maxY));


    selectedObject.style.left=x+"px";

    selectedObject.style.top=y+"px";
}


function stopDrag(){

    if(!selectedObject)
        return;

    selectedObject.removeEventListener(
        "pointermove",
        dragObject
    );

    selectedObject=null;
}


/* =====================================================
   POSIÇÕES INICIAIS
===================================================== */

function defaultObjects(){

    const objects=
        document.getElementById("objects");

    objects.innerHTML="";


    const roomData=rooms[currentRoom];


    /* móveis */

    roomData.furniture.forEach(
        (type,index)=>{

            let x=100+(index%4)*280;

            let y=270+Math.floor(index/4)*150;

            createObject(type,x,y);

        }
    );


    /* decoração */

    roomData.decor.forEach(
        (type,index)=>{

            let x=200+(index%5)*220;

            let y=100+(index%2)*100;

            createObject(type,x,y);

        }
    );

}


/* =====================================================
   SALVAR
===================================================== */

function saveRoom(){

    if(!currentRoom)
        return;


    const data=[];

    document
        .querySelectorAll("#objects .object")
        .forEach(obj=>{

            data.push({

                type:obj.dataset.type,

                x:parseInt(obj.style.left)||0,

                y:parseInt(obj.style.top)||0

            });

        });


    localStorage.setItem(
        "dreamRoom3D_"+currentRoom,
        JSON.stringify(data)
    );


    alert("✨ Quarto salvo com sucesso!");
}


/* =====================================================
   CARREGAR
===================================================== */

function loadRoom(){

    if(!currentRoom)
        return;


    const saved=
        localStorage.getItem(
            "dreamRoom3D_"+currentRoom
        );


    const objects=
        document.getElementById("objects");

    objects.innerHTML="";


    if(!saved){

        defaultObjects();

        return;

    }


    try{

        const data=JSON.parse(saved);

        data.forEach(item=>{

            createObject(
                item.type,
                item.x,
                item.y
            );

        });

    }

    catch{

        defaultObjects();

    }

}


/* =====================================================
   LIMPAR
===================================================== */

function clearRoom(){

    if(!confirm("Quer realmente limpar este quarto?"))
        return;


    localStorage.removeItem(
        "dreamRoom3D_"+currentRoom
    );


    defaultObjects();
}


/* =====================================================
   VOLTAR
===================================================== */

function backToRooms(){

    document.getElementById("game").style.display="none";

    document.getElementById("selection").style.display="block";

    document.getElementById("objects").innerHTML="";

    currentRoom=null;

}

</script>

</body>
</html>
