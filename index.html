<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABYSS 🐟</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  overflow: hidden;
  background: #00111f;
  font-family: Arial, sans-serif;
  color: white;
}

canvas {
  display: block;
  background: linear-gradient(#006994, #00334d 55%, #00131f);
}

#menu {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at center, rgba(0,180,255,.2), transparent 45%),
    rgba(0,8,15,.88);
  z-index: 10;
}

.box {
  width: min(600px, 90%);
  text-align: center;
  padding: 40px;
  border: 2px solid #27d9ff;
  border-radius: 25px;
  background: rgba(0,20,35,.9);
  box-shadow: 0 0 40px rgba(0,200,255,.3);
}

h1 {
  font-size: clamp(45px, 10vw, 90px);
  color: #46eaff;
  text-shadow: 0 0 25px #00bfff;
  margin-bottom: 10px;
}

.subtitle {
  color: #b8eaff;
  margin-bottom: 25px;
}

button {
  border: 0;
  padding: 16px 35px;
  border-radius: 12px;
  background: #16c8ff;
  color: #00131f;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 25px #16c8ff;
}

#hud {
  position: fixed;
  top: 15px;
  left: 15px;
  right: 15px;
  display: none;
  justify-content: space-between;
  pointer-events: none;
  z-index: 5;
}

.hudBox {
  padding: 10px 16px;
  border-radius: 12px;
  background: rgba(0,15,25,.65);
  border: 1px solid rgba(100,230,255,.5);
  backdrop-filter: blur(5px);
}

#gameOver {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  align-items: center;
  justify-content: center;
  background: rgba(0,5,10,.8);
}

.gameOverBox {
  text-align: center;
  background: #001b2a;
  border: 2px solid #27d9ff;
  padding: 40px;
  border-radius: 25px;
}

#message {
  margin: 15px 0 25px;
  color: #b8eaff;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
  <div class="box">
    <h1>ABYSS</h1>
    <div class="subtitle">
      🐟 O PEIXE DO ABISMO
    </div>

    <p style="line-height:1.7;margin-bottom:25px;">
      Você é o predador do fundo do mar.<br>
      Coma criaturas menores e mergulhadores 🤿.<br>
      Cresça, sobreviva e domine o oceano.
    </p>

    <button onclick="startGame()">MERGULHAR 🌊</button>

    <p style="margin-top:20px;font-size:13px;color:#75aabd;">
      WASD ou SETAS para nadar
    </p>
  </div>
</div>

<div id="hud">
  <div class="hudBox">
    🐟 Tamanho: <span id="size">1</span>
  </div>

  <div class="hudBox">
    ⭐ Pontos: <span id="score">0</span>
  </div>

  <div class="hudBox">
    ❤️ <span id="life">3</span>
  </div>
</div>

<div id="gameOver">
  <div class="gameOverBox">
    <h1 style="font-size:50px;">FIM DE JOGO</h1>

    <div id="message"></div>

    <button onclick="startGame()">TENTAR NOVAMENTE 🔄</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}

resize();
addEventListener("resize", resize);

const keys = {};

addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});

addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

let player;
let entities = [];
let bubbles = [];
let score = 0;
let life = 3;
let gameRunning = false;
let spawnTimer = 0;
let worldTime = 0;

function startGame() {

  document.getElementById("menu").style.display = "none";
  document.getElementById("gameOver").style.display = "none";
  document.getElementById("hud").style.display = "flex";

  score = 0;
  life = 3;

  player = {
    x: W / 2,
    y: H / 2,
    size: 35,
    speed: 5,
    direction: 1,
    invincible: 0
  };

  entities = [];

  for (let i = 0; i < 18; i++) {
    spawnEntity();
  }

  bubbles = [];

  for (let i = 0; i < 80; i++) {
    bubbles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 3 + 1,
      speed: Math.random() * 1.5 + .5
    });
  }

  gameRunning = true;
  updateHUD();
  requestAnimationFrame(loop);
}

function spawnEntity() {

  const random = Math.random();

  let type;

  if (random < .55) {
    type = "fish";
  } else if (random < .82) {
    type = "human";
  } else if (random < .94) {
    type = "shark";
  } else {
    type = "mine";
  }

  let size;

  if (type === "fish") {
    size = Math.random() * 15 + 12;
  }

  if (type === "human") {
    size = 22;
  }

  if (type === "shark") {
    size = 55;
  }

  if (type === "mine") {
    size = 25;
  }

  entities.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size,
    type,
    speed: Math.random() * 1.5 + .4,
    phase: Math.random() * Math.PI * 2,
    direction: Math.random() > .5 ? 1 : -1
  });
}

function update() {

  worldTime++;

  let dx = 0;
  let dy = 0;

  if (keys["arrowleft"] || keys["a"]) dx--;
  if (keys["arrowright"] || keys["d"]) dx++;
  if (keys["arrowup"] || keys["w"]) dy--;
  if (keys["arrowdown"] || keys["s"]) dy++;

  if (dx !== 0 || dy !== 0) {

    const length = Math.hypot(dx, dy);

    dx /= length;
    dy /= length;

    player.x += dx * player.speed;
    player.y += dy * player.speed;

    if (dx !== 0) {
      player.direction = dx > 0 ? 1 : -1;
    }
  }

  player.x = Math.max(player.size, Math.min(W - player.size, player.x));
  player.y = Math.max(player.size, Math.min(H - player.size, player.y));

  if (player.invincible > 0) {
    player.invincible--;
  }

  spawnTimer++;

  if (spawnTimer > 55) {
    spawnTimer = 0;
    spawnEntity();
  }

  entities.forEach(e => {

    e.phase += .02;

    if (e.type === "shark") {

      const angle = Math.atan2(
        player.y - e.y,
        player.x - e.x
      );

      e.x += Math.cos(angle) * e.speed;
      e.y += Math.sin(angle) * e.speed;

    } else {

      e.x += e.speed * e.direction;

      e.y += Math.sin(e.phase) * .4;
    }

    if (e.x < -100) e.x = W + 100;
    if (e.x > W + 100) e.x = -100;

    if (e.y < -100) e.y = H + 100;
    if (e.y > H + 100) e.y = -100;
  });

  for (let i = entities.length - 1; i >= 0; i--) {

    const e = entities[i];

    const distance = Math.hypot(
      player.x - e.x,
      player.y - e.y
    );

    if (distance < player.size + e.size * .65) {

      if (e.type === "fish" || e.type === "human") {

        if (player.size >= e.size * .9) {

          score += e.type === "human" ? 100 : 25;

          player.size += e.type === "human" ? 3 : 1;

          entities.splice(i, 1);

          createBubbles(e.x, e.y, 10);

        }

      } else {

        if (player.invincible <= 0) {

          life--;

          player.invincible = 100;

          player.size = Math.max(20, player.size - 3);

          createBubbles(player.x, player.y, 15);

          if (life <= 0) {
            endGame();
            return;
          }
        }
      }
    }
  }

  bubbles.forEach(b => {

    b.y -= b.speed;

    if (b.y < -10) {
      b.y = H + 10;
      b.x = Math.random() * W;
    }
  });

  updateHUD();
}

function createBubbles(x, y, amount) {

  for (let i = 0; i < amount; i++) {

    bubbles.push({
      x,
      y,
      r: Math.random() * 4 + 1,
      speed: Math.random() * 2 + .5
    });
  }
}

function updateHUD() {

  document.getElementById("score").textContent = score;
  document.getElementById("life").textContent = life;
  document.getElementById("size").textContent =
    Math.floor(player.size / 35 * 10) / 10;
}

function drawBackground() {

  const gradient = ctx.createLinearGradient(0, 0, 0, H);

  gradient.addColorStop(0, "#006b94");
  gradient.addColorStop(.5, "#003e5c");
  gradient.addColorStop(1, "#00131f");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  // luz da superfície

  const glow = ctx.createRadialGradient(
    W / 2,
    0,
    0,
    W / 2,
    0,
    H * .7
  );

  glow.addColorStop(0, "rgba(100,230,255,.25)");
  glow.addColorStop(1, "rgba(0,0,0,0)");

  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // fundo

  ctx.fillStyle = "#001018";

  ctx.beginPath();
  ctx.moveTo(0, H);

  for (let x = 0; x <= W; x += 40) {

    const y =
      H - 45 -
      Math.sin(x * .015) * 15;

    ctx.lineTo(x, y);
  }

  ctx.lineTo(W, H);
  ctx.closePath();

  ctx.fill();

  // algas

  for (let i = 0; i < 15; i++) {

    const x = i * (W / 15);

    ctx.strokeStyle = "rgba(0,180,130,.35)";
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.moveTo(x, H);

    ctx.quadraticCurveTo(
      x - 20,
      H - 80,
      x + Math.sin(i) * 30,
      H - 140
    );

    ctx.stroke();
  }
}

function drawBubbles() {

  bubbles.forEach(b => {

    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);

    ctx.strokeStyle = "rgba(180,240,255,.35)";
    ctx.stroke();
  });
}

function drawPlayer() {

  if (
    player.invincible > 0 &&
    Math.floor(player.invincible / 6) % 2 === 0
  ) return;

  ctx.save();

  ctx.translate(player.x, player.y);

  ctx.scale(
    player.direction,
    1
  );

  // cauda

  ctx.fillStyle = "#ff7b21";

  ctx.beginPath();

  ctx.moveTo(-player.size * .5, 0);
  ctx.lineTo(-player.size * 1.15, -player.size * .55);
  ctx.lineTo(-player.size * 1.05, player.size * .55);
  ctx.closePath();

  ctx.fill();

  // corpo

  const gradient =
    ctx.createLinearGradient(
      0,
      -player.size,
      0,
      player.size
    );

  gradient.addColorStop(0, "#ffd34d");
  gradient.addColorStop(1, "#ef4f19");

  ctx.fillStyle = gradient;

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    player.size,
    player.size * .6,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  // barbatana

  ctx.fillStyle = "#e94818";

  ctx.beginPath();

  ctx.moveTo(-5, -player.size * .45);
  ctx.lineTo(5, -player.size * .95);
  ctx.lineTo(18, -player.size * .45);

  ctx.fill();

  // olho

  ctx.fillStyle = "white";

  ctx.beginPath();
  ctx.arc(
    player.size * .45,
    -player.size * .18,
    player.size * .16,
    0,
    Math.PI * 2
  );
  ctx.fill();

  ctx.fillStyle = "#00131f";

  ctx.beginPath();
  ctx.arc(
    player.size * .5,
    -player.size * .18,
    player.size * .08,
    0,
    Math.PI * 2
  );
  ctx.fill();

  // boca

  ctx.strokeStyle = "#42130a";
  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.arc(
    player.size * .55,
    player.size * .08,
    player.size * .2,
    0,
    Math.PI
  );

  ctx.stroke();

  ctx.restore();
}

function drawFish(e) {

  ctx.save();

  ctx.translate(e.x, e.y);
  ctx.scale(e.direction, 1);

  ctx.fillStyle = "#6de3ff";

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    e.size,
    e.size * .55,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(-e.size * .7, 0);
  ctx.lineTo(-e.size * 1.3, -e.size * .5);
  ctx.lineTo(-e.size * 1.3, e.size * .5);
  ctx.closePath();

  ctx.fill();

  ctx.fillStyle = "white";

  ctx.beginPath();
  ctx.arc(e.size * .55, -e.size * .15, e.size * .14, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawHuman(e) {

  ctx.save();

  ctx.translate(e.x, e.y);

  // cabeça

  ctx.fillStyle = "#f2c49b";

  ctx.beginPath();
  ctx.arc(0, -10, 8, 0, Math.PI * 2);
  ctx.fill();

  // roupa

  ctx.fillStyle = "#dfefff";

  ctx.fillRect(-8, 0, 16, 22);

  // braços

  ctx.strokeStyle = "#f2c49b";
  ctx.lineWidth = 5;

  ctx.beginPath();

  ctx.moveTo(-7, 5);
  ctx.lineTo(-18, 15);

  ctx.moveTo(7, 5);
  ctx.lineTo(18, 15);

  ctx.stroke();

  // pernas

  ctx.strokeStyle = "#17344a";
  ctx.lineWidth = 6;

  ctx.beginPath();

  ctx.moveTo(-4, 20);
  ctx.lineTo(-8, 34);

  ctx.moveTo(4, 20);
  ctx.lineTo(8, 34);

  ctx.stroke();

  // cilindro de oxigênio

  ctx.fillStyle = "#f5f5f5";
  ctx.fillRect(10, -3, 5, 20);

  ctx.restore();
}

function drawShark(e) {

  ctx.save();

  ctx.translate(e.x, e.y);

  const angle = Math.atan2(
    player.y - e.y,
    player.x - e.x
  );

  ctx.rotate(angle);

  ctx.fillStyle = "#526d78";

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    e.size,
    e.size * .4,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  // cauda

  ctx.beginPath();

  ctx.moveTo(-e.size * .7, 0);
  ctx.lineTo(-e.size * 1.35, -e.size * .5);
  ctx.lineTo(-e.size * 1.2, e.size * .5);
  ctx.closePath();

  ctx.fill();

  // barbatana

  ctx.beginPath();

  ctx.moveTo(0, -e.size * .3);
  ctx.lineTo(10, -e.size * .9);
  ctx.lineTo(25, -e.size * .25);
  ctx.closePath();

  ctx.fill();

  ctx.fillStyle = "white";

  ctx.beginPath();
  ctx.arc(e.size * .55, -e.size * .12, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawMine(e) {

  ctx.save();

  ctx.translate(e.x, e.y);

  ctx.fillStyle = "#333";

  ctx.beginPath();

  ctx.arc(0, 0, e.size, 0, Math.PI * 2);

  ctx.fill();

  ctx.strokeStyle = "#111";
  ctx.lineWidth = 5;

  for (let i = 0; i < 8; i++) {

    const a = i * Math.PI / 4;

    ctx.beginPath();

    ctx.moveTo(
      Math.cos(a) * e.size,
      Math.sin(a) * e.size
    );

    ctx.lineTo(
      Math.cos(a) * (e.size + 12),
      Math.sin(a) * (e.size + 12)
    );

    ctx.stroke();
  }

  ctx.fillStyle = "#ff4444";

  ctx.beginPath();

  ctx.arc(0, 0, 7, 0, Math.PI * 2);

  ctx.fill();

  ctx.restore();
}

function drawEntities() {

  entities.forEach(e => {

    if (e.type === "fish") drawFish(e);
    if (e.type === "human") drawHuman(e);
    if (e.type === "shark") drawShark(e);
    if (e.type === "mine") drawMine(e);

  });
}

function draw() {

  drawBackground();
  drawBubbles();
  drawEntities();
  drawPlayer();

  // profundidade

  ctx.fillStyle = "rgba(0,0,0,.15)";

  const darkness =
    Math.min(player.y / H, 1) * .3;

  ctx.fillRect(0, 0, W, H * darkness);
}

function loop() {

  if (!gameRunning) return;

  update();
  draw();

  requestAnimationFrame(loop);
}

function endGame() {

  gameRunning = false;

  document.getElementById("hud").style.display = "none";

  document.getElementById("message").innerHTML =
    `🐟 Você chegou ao fim da expedição.<br><br>
     ⭐ Pontuação: <strong>${score}</strong><br>
     📏 Tamanho final: <strong>${Math.floor(player.size)}</strong>`;

  document.getElementById("gameOver").style.display = "flex";
}
</script>

</body>
</html>
